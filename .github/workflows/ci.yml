name: CI Pipeline

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run Snyk Code Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Ruff
        run: |
          ruff check src/algorithms/ src/analytics/ src/backtesting/ src/calibration/ src/core/ src/data/ src/data_sources/ src/ensembling/ src/factories/ src/feature_engineering/ src/features/ src/models/ src/optimization/ src/pipeline/ src/risk_management/ src/trading/

      - name: Run Black check
        run: |
          black --check src/algorithms/ src/analytics/ src/backtesting/ src/calibration/ src/core/ src/data/ src/data_sources/ src/ensembling/ src/factories/ src/feature_engineering/ src/features/ src/models/ src/optimization/ src/pipeline/ src/risk_management/ src/trading/

      - name: Run Bandit
        run: |
          bandit -r src/algorithms/ src/analytics/ src/backtesting/ src/calibration/ src/core/ src/data/ src/data_sources/ src/ensembling/ src/factories/ src/feature_engineering/ src/features/ src/models/ src/optimization/ src/pipeline/ src/risk_management/ src/trading/

      - name: Run mypy
        run: |
          mypy src/algorithms/ src/analytics/ src/backtesting/ src/calibration/ src/core/ src/data/ src/data_sources/ src/ensembling/ src/factories/ src/feature_engineering/ src/features/ src/models/ src/optimization/ src/pipeline/ src/risk_management/ src/trading/ --ignore-missing-imports
        
      - name: Run pytest
        run: |
          pytest tests/
