name: CI Pipeline


on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov

      - name: Run Snyk dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

      - name: Run Ruff
        run: ruff check src/

      - name: Run Black check
        run: black --check src/

      - name: Run Bandit
        run: bandit -r src/

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=OleksanderSS_trading_project
            -Dsonar.organization=oleksanderss
            -Dsonar.sources=src
            -Dsonar.python.version=3.12
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.ipynb_checkpoints/**,**/*.ipynb,**/.gemini/**,**/venv/**,**/.venv/**,src/colab/**,src/devtools/**,src/trained_models/**
