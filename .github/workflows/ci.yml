name: CI Pipeline

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # Фікс депрекації Node.js 20

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2  # Найсвіжіший стабільний checkout
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0  # Оновлена версія Python setup
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov pytest-asyncio aiofiles google-api-python-client

      - name: Run Snyk dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

      - name: Run Ruff
        continue-on-error: true
        run: ruff check src/

      - name: Run Black check
        continue-on-error: true
        run: black --check src/

      - name: Run Bandit
        continue-on-error: true
        run: bandit -r src/

      - name: Run mypy
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      - name: Verify test collection (blocking)
        env:
          PYTHONPATH: .
        run: pytest --collect-only -q
        # Deliberately has NO continue-on-error / || true: this must fail the
        # build. A collection error (a broken import in any test file) means
        # the ENTIRE test suite silently stops proving anything past that
        # point -- this is what let 52 deleted CLI wrappers and 100+ deleted
        # src/ modules go unnoticed for days in 2026-07, since the actual
        # test step below can't fail no matter what.

      - name: Contract tests (blocking)
        env:
          PYTHONPATH: .
        run: pytest tests/contracts -q
        # Deliberately has NO `|| true`. tests/contracts went green on
        # 2026-09-04 -- 194 passed, 4 skipped, 0 failed -- when the last
        # LOGGED_THEN_EMPTY site over the ceiling was exempted with its caller
        # named and verified. Until then the whole suite ran behind the
        # `|| true` below and NOTHING in it could fail a build.
        #
        # This is the half of the suite worth gating on: the ratchets live
        # here. `_frame_copy_scan`, `_lookahead_scan` and
        # `_silent_failure_scan` carry ceilings that may only fall, and a
        # ceiling that cannot fail CI is a comment. The same is true of the
        # promotion-family reconciliation, the sealed-period checks and the
        # naive-opponent contracts -- every one of them exists because a
        # defect got through once, and every one of them was decorative while
        # this step did not exist.
        #
        # 4 skips are expected and named in their own skip reasons (a
        # disabled analyzer, an archived calibration engine, and two
        # financial-math tests whose modules are absent). A skip is not a
        # pass: `src.risk_management` does not exist while
        # src/config/risk_management.yaml does, which is the same shape as
        # `critical: true` declared in config and read nowhere. Recorded
        # rather than fixed here.

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: pytest --cov=src --cov-report=xml --cov-report=lcov || true
        # NOTE: this `|| true` means this step can never fail the build,
        # regardless of how many tests fail. It stays for now because
        # tests/dean_os still carries known pre-existing failures, AND
        # because that suite silently skips about a thousand tests when run
        # as a directory -- a green run there is not evidence, so gating on
        # it would gate on nothing.
        #
        # What changed on 2026-09-04: tests/contracts no longer hides behind
        # this line. It runs above as its own blocking step, so a broken
        # ratchet now fails the build even though this step still cannot.
        # Remaining work to remove `|| true` entirely: give tests/dean_os a
        # by-name run with asserted counts, then mark its known failures
        # `@pytest.mark.xfail` with reasons.

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.4.3  # Фікс під Node.js 24
        with:
          name: coverage-report
          path: coverage.xml

      - name: Regenerate reachability diagnostics (informational)
        continue-on-error: true
        timeout-minutes: 5
        # continue-on-error only catches a non-zero exit, not a hang -- this
        # exact step hung past 10 minutes locally on 2026-07-26 before the
        # underlying rglob bug was fixed. The timeout is the actual guard
        # against burning CI minutes if a similar regression shows up again.
        env:
          PYTHONPATH: .
        run: python diagnostics/run_all_diagnostics.py
        # Not a merge gate -- `diagnostic_reports/*` committed in the repo
        # are a snapshot, refreshed manually before audit passes, not by
        # this step. This step exists so the *tooling itself* can't rot
        # unnoticed again the way it did for ~6 weeks before 2026-07-26:
        # a pathological unpruned-rglob scan in config_reachability_checker.py
        # would hang here silently for hours with no signal anywhere. Now a
        # broken/hanging diagnostics script shows up as a red step in the
        # Actions log even though it can't fail the build.

      - name: Upload reachability diagnostics artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4.4.3
        with:
          name: reachability-diagnostics
          path: diagnostic_reports/

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.8  # Фікс під Node.js 24
        with:
          name: coverage-report

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6  # Оновлено до безпечної v6, як вимагає лог!
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=OleksanderSS_trading_project
            -Dsonar.organization=oleksanderss
            -Dsonar.sources=src
            -Dsonar.python.version=3.12
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.ipynb_checkpoints/**,**/*.ipynb,**/.gemini/**,**/venv/**,**/.venv/**,src/colab/**,src/devtools/**,src/trained_models/**