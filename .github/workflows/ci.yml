name: CI Pipeline

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # Фікс депрекації Node.js 20

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2  # Найсвіжіший стабільний checkout
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0  # Оновлена версія Python setup
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov pytest-asyncio aiofiles google-api-python-client

      - name: Run Snyk dependency scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

      - name: Run Ruff
        continue-on-error: true
        run: ruff check src/

      - name: Run Black check
        continue-on-error: true
        run: black --check src/

      - name: Run Bandit
        continue-on-error: true
        run: bandit -r src/

      - name: Run mypy
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      - name: Verify test collection (blocking)
        env:
          PYTHONPATH: .
        run: pytest --collect-only -q
        # Deliberately has NO continue-on-error / || true: this must fail the
        # build. A collection error (a broken import in any test file) means
        # the ENTIRE test suite silently stops proving anything past that
        # point -- this is what let 52 deleted CLI wrappers and 100+ deleted
        # src/ modules go unnoticed for days in 2026-07, since the actual
        # test step below can't fail no matter what.

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: pytest --cov=src --cov-report=xml --cov-report=lcov || true
        # NOTE: this `|| true` means this step can never fail the build,
        # regardless of how many tests fail. As of 2026-07-25 there are 10
        # known, individually-documented pre-existing failures (see
        # tests/dean_os and tests/contracts) -- removing `|| true` today
        # would start failing every CI run on those, not on new breakage.
        # Recommended next step: mark those 10 as explicit `@pytest.mark.xfail`
        # (with reasons) so a clean pass/fail baseline can be established,
        # then remove `|| true` here so this step actually gates merges.

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.4.3  # Фікс під Node.js 24
        with:
          name: coverage-report
          path: coverage.xml

      - name: Regenerate reachability diagnostics (informational)
        continue-on-error: true
        timeout-minutes: 5
        # continue-on-error only catches a non-zero exit, not a hang -- this
        # exact step hung past 10 minutes locally on 2026-07-26 before the
        # underlying rglob bug was fixed. The timeout is the actual guard
        # against burning CI minutes if a similar regression shows up again.
        env:
          PYTHONPATH: .
        run: python diagnostics/run_all_diagnostics.py
        # Not a merge gate -- `diagnostic_reports/*` committed in the repo
        # are a snapshot, refreshed manually before audit passes, not by
        # this step. This step exists so the *tooling itself* can't rot
        # unnoticed again the way it did for ~6 weeks before 2026-07-26:
        # a pathological unpruned-rglob scan in config_reachability_checker.py
        # would hang here silently for hours with no signal anywhere. Now a
        # broken/hanging diagnostics script shows up as a red step in the
        # Actions log even though it can't fail the build.

      - name: Upload reachability diagnostics artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4.4.3
        with:
          name: reachability-diagnostics
          path: diagnostic_reports/

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.8  # Фікс під Node.js 24
        with:
          name: coverage-report

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6  # Оновлено до безпечної v6, як вимагає лог!
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=OleksanderSS_trading_project
            -Dsonar.organization=oleksanderss
            -Dsonar.sources=src
            -Dsonar.python.version=3.12
            -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.ipynb_checkpoints/**,**/*.ipynb,**/.gemini/**,**/venv/**,**/.venv/**,src/colab/**,src/devtools/**,src/trained_models/**