# SonarQube / SonarCloud Project Configuration
sonar.projectKey=trading_project
sonar.projectName=Trading Project - Production Audit
sonar.projectVersion=1.0

# Production source code only
sonar.sources=src
sonar.python.version=3.10

# Tests, if you have a tests folder
sonar.tests=tests

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.ipynb_checkpoints/**,**/*.ipynb,**/.gemini/**,**/venv/**,**/.venv/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Optional: only keep this if CI actually generates pylint_report.txt before Sonar runs
sonar.python.pylint.reportPath=pylint_report.txt