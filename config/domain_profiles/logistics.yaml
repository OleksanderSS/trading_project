contradiction_rules:
  - Strong freight demand but rising fuel costs compresses margins.
  - Positive volume growth with falling rates reduces confidence in revenue outlook.
  - Supply chain congestion benefits some subsectors (ocean, warehousing) but hurts others (retail logistics).
  - Strong price momentum without freight rate evidence is market evidence only.
  - E-commerce growth does not automatically imply parcel profitability.
direct_ticker_evidence_rules:
  - Company-specific earnings or guidance evidence.
  - Ticker-specific price or relative-strength confirmation.
  - Company-specific fleet utilization or capacity data.
  - Trade or freight rate evidence for specific routes.
blocked_if_missing:
  - No evidence timestamp or as_of.
  - No supply or demand evidence.
  - No market confirmation for investment-facing thesis.
  - No ticker-specific evidence for direct_ticker_thesis.
  - Contradicting evidence exists but is not addressed.
