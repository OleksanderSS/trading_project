domain_id: logistics
display_name: Logistics & Supply Chain
sector_label: logistics
macro_evidence_type: macro_context
description: >-
  Analyzes logistics, freight, shipping, supply chain infrastructure,
  and transportation equities. Covers ocean freight, air cargo, rail,
  trucking, parcel delivery, warehousing, port operations, and
  logistics technology.
horizon_days_default: 180
allowed_horizons: [30, 90, 180, 365, 730]
core_questions:
  - Is freight demand growing or contracting?
  - Are shipping rates and capacity utilization supportive?
  - Is supply chain congestion easing or worsening?
  - Are fuel costs and labor availability affecting margins?
  - Is e-commerce and parcel volume trending up or down?
  - Are trade volumes and port activity supportive?
  - Does evidence support a sector thesis or direct ticker theses?
required_evidence_types:
  - supply
  - demand
  - policy_or_geopolitical
  - market_confirmation
useful_evidence_types:
  - freight_rates
  - shipping_capacity
  - port_congestion
  - fuel_costs
  - labor_availability
  - ecommerce_volume
  - trade_data
  - warehousing_utilization
  - fleet_utilization
  - tariff_policy
  - valuation_context
  - relative_strength
