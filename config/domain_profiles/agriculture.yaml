domain_id: agriculture
display_name: Agriculture & Soft Commodities
sector_label: agriculture
macro_evidence_type: macro_context
description: >-
  Analyzes agricultural commodities, soft commodities, crop yields,
  weather patterns, fertilizer markets, food supply chains, and
  agricultural policy. Covers row crops, livestock, dairy, and
  agribusiness equities.
horizon_days_default: 180
allowed_horizons: [30, 90, 180, 365, 730]
core_questions:
  - Are crop yields improving or declining?
  - Is weather risk (drought, flood, frost) affecting supply?
  - Are input costs (fertilizer, fuel, labor) supportive?
  - Is global demand for food and feed stable or growing?
  - Are inventories and storage levels supportive of prices?
  - Is agricultural policy or trade war affecting the sector?
  - Does evidence support a sector thesis or direct ticker theses?
required_evidence_types:
  - supply
  - demand
  - policy_or_geopolitical
  - market_confirmation
useful_evidence_types:
  - weather_risk
  - crop_production
  - planting_area
  - fertilizer_prices
  - inventory_levels
  - export_data
  - ethanol_margins
  - livestock_herd
  - dairy_prices
  - farm_income
  - valuation_context
  - relative_strength
