contradiction_rules:
  - Strong crop yields with falling prices reduces confidence in agricultural equities.
  - Positive demand but weather-related supply shock creates mixed outlook.
  - Bullish commodity thesis does not automatically imply bullish equity thesis.
  - Rising input costs with stable output prices compresses margins.
  - Strong price momentum without supply/demand evidence is market evidence only.
direct_ticker_evidence_rules:
  - Company-specific earnings or guidance evidence.
  - Ticker-specific price or relative-strength confirmation.
  - Company-specific crop production or cost data.
  - Commodity-specific price or export data.
blocked_if_missing:
  - No evidence timestamp or as_of.
  - No supply or demand evidence.
  - No market confirmation for investment-facing thesis.
  - No ticker-specific evidence for direct_ticker_thesis.
  - Contradicting evidence exists but is not addressed.
