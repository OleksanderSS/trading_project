domain_id: macro_policy
display_name: Macro Policy
sector_label: macro
macro_evidence_type: macro_context
description: Analyzes central bank policy, fiscal policy, inflation, growth, labor markets, and policy transmission.
horizon_days_default: 180
allowed_horizons: [30, 90, 180, 365, 730]
core_questions:
  - Is monetary policy easing, tightening, or staying restrictive?
  - Is inflation improving or reaccelerating?
  - Is growth resilient or deteriorating?
  - How do fiscal policy and issuance affect liquidity and rates?
  - Which asset classes are most exposed to the policy regime?
  - Are credit conditions tightening or loosening?
  - Is the yield curve signaling recession risk or normalization?
required_evidence_types:
  - inflation
  - rates_policy
  - growth
  - labor_market
  - market_confirmation
useful_evidence_types:
  - central_bank_guidance
  - yield_curve
  - credit_spreads
  - fiscal_issuance
  - liquidity_conditions
  - consumer_sentiment
  - housing_market
  - trade_policy
  - currency_markets
  - commodity_prices
  - bank_lending_standards
sector_keywords:
