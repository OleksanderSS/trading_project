contradiction_rules:
  - Easing narrative with rising inflation reduces confidence.
  - Soft landing narrative with widening credit spreads must be treated as mixed.
  - Strong equity rally without monetary policy support is market evidence only.
  - Recession calls require both growth and labor market evidence.
  - Divergence between Fed guidance and market pricing reduces directional confidence.
direct_ticker_evidence_rules:
  - Asset-specific rate sensitivity evidence.
  - Ticker-specific replay/price confirmation.
  - Flow or positioning evidence for the instrument.
  - Duration or credit spread exposure data for the asset.
blocked_if_missing:
  - No inflation evidence.
  - No policy evidence.
  - No market confirmation for investment-facing thesis.
  - No direct ticker evidence for direct_ticker_thesis.
  - Contradicting evidence exists but is not addressed.
