contradiction_rules:
  - Rising occupancy with falling rent growth reduces confidence in revenue momentum.
  - Low interest rates with high cap rates is positive but requires explicit rate sensitivity analysis.
  - Strong construction pipeline with weak demand suggests oversupply risk.
  - Strong price momentum without occupancy or rent evidence is market evidence only.
  - REIT dividend yield above sector average may indicate elevated risk, not value.
direct_ticker_evidence_rules:
  - Company-specific earnings, FFO, or NOI evidence.
  - Ticker-specific price or relative-strength confirmation.
  - Property-specific occupancy or lease renewal data.
  - Portfolio transaction or disposition evidence.
blocked_if_missing:
  - No evidence timestamp or as_of.
  - No supply or demand evidence.
  - No market confirmation for investment-facing thesis.
  - No ticker-specific evidence for direct_ticker_thesis.
  - Contradicting evidence exists but is not addressed.
