domain_id: real_estate
display_name: Real Estate & REITs
sector_label: real_estate
macro_evidence_type: macro_context
description: >-
  Analyzes real estate investment trusts, property markets, construction,
  and real estate services. Covers office, retail, industrial, residential,
  hospitality, data center, healthcare, and self-storage property sectors,
  REIT valuation, interest rate sensitivity, and real estate cycle.
horizon_days_default: 180
allowed_horizons: [30, 90, 180, 365, 730]
core_questions:
  - Is the property cycle improving or deteriorating?
  - Are occupancy rates and rent growth supportive?
  - Are interest rates and cap rates affecting valuations?
  - Is construction activity and development pipeline growing?
  - Are property transaction volumes recovering?
  - Are REIT balance sheets and dividend coverage healthy?
  - Does evidence support a sector thesis or direct ticker theses?
required_evidence_types:
  - supply
  - demand
  - policy_or_geopolitical
  - market_confirmation
useful_evidence_types:
  - occupancy_rates
  - rent_growth
  - cap_rates
  - interest_rate_sensitivity
  - construction_pipeline
  - transaction_volume
  - dividend_coverage
  - loan_delinquency
  - housing_starts
  - building_permits
  - commercial_real_estate_prices
  - valuation_context
  - relative_strength
