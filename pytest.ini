[pytest]
# THE authoritative pytest configuration for this project.
#
# pyproject.toml also carried a [tool.pytest.ini_options] block with
# `--cov=src --cov-report=xml --cov-report=lcov`. pytest ignores that block
# entirely whenever a pytest.ini exists, so those coverage flags had never
# taken effect: coverage.xml on disk was last written 2026-06-11 and .coverage
# 2026-06-04, while the suite was being run daily. Anyone reading pyproject
# would have concluded coverage was measured on every run. It was not.
# Consolidated here so there is one file to read. See Codex audit §23.
#
# Coverage is opt-in rather than always-on: this suite is ~2,860 tests and
# instrumenting every run costs time on a machine that is also running the
# pipeline. Measure it deliberately:
#
#   pytest --cov=src --cov-report=term-missing
#
# ...and treat the number as a map of what was EXERCISED, not of what is
# correct. The defect that put 54,000 bars on the wrong dates ran on every
# batch with no exception raised; line coverage of it was total.
testpaths = tests
norecursedirs = pytest-cache-files-* mlruns data logs reports analysis_results .venv venv env __pycache__
addopts = -p no:cacheprovider
