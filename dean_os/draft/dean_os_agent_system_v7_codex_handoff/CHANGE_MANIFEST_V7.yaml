  - existing pipeline stages 0-3 artifact intake
  - stage-aware pipeline control
  - accepted-evidence-only downstream boundary
  - cross-branch system run manifest
  - full-system CLI
contracts:
  - dean_system_topology_v1
  - dean_system_run_manifest_v1
  - dean_pipeline_stage03_packet_v1
