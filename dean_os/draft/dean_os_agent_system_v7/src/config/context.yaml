
calendar:
  country: US
  default_year: 2026
  max_shift_days: 30

visualization:
  figsize: [12, 6]
  bins: 30
  colors_map:
    bull: "#e0ffe0"
    bear: "#ffe0e0"
    sideways: "#f0f0f0"
    unknown: "#ffffff"
  trend_colors:
    aligned: "green"
    divergent: "red"
  macro_bias_fontsize: 8
  macro_bias_color: "gray"

