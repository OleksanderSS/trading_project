impact_analysis:
  linguistic_patterns:
    high_impact:
      - "crash"
      - "collapse"
      - "crisis"
      - "bubble"
      - "recession"
      - "depression"
      - "war"
      - "sanctions"
      - "default"
      - "bankruptcy"
      - "shutdown"
    low_impact:
      - "rally"
      - "recovery"
      - "growth"
      - "expansion"
      - "bull market"
      - "optimistic"
      - "positive"
      - "improving"
      - "stabilizing"
      - "support"
    neutral:
      - "mixed"
      - "flat"
      - "unchanged"
      - "steady"
      - "stable"
      - "holding"
      - "cautious"
      - "uncertain"
      - "waiting"
      - "monitoring"
  impact_weights:
    monetary_policy: 1.0
    banking_crisis: 1.0
    market_crash: 1.0
    pandemic: 1.0
    trade_policy: 0.9
    bubble_burst: 0.9
    housing_crisis: 0.9
    energy_crisis: 0.8
    currency_crisis: 0.8
    sovereign_debt: 0.8
    flash_crash: 0.8
    geopolitical: 0.8
    political: 0.7
    natural_disaster: 0.7
    retail_trading: 0.7
    quantitative: 0.6

fred_mapping:
  indicators:
    ism_services_pmi: 'SRV_PMI'
    consumer_confidence_index: 'CONS_SENT'
    adp_employment_change: 'EMP_CHANGE'
  priorities:
    ism_services_pmi: 9
    consumer_confidence_index: 8
    adp_employment_change: 8
  components:
    ism_services_pmi:
      business_activity: 'Business Activity Index'
      new_orders: 'New Orders Index'
      employment: 'Employment Index'
      prices: 'Prices Index'
    consumer_confidence_index:
      present_situation: 'Present Situation Index'
      expectations: 'Expectations Index'
    adp_employment_change:
      private_sector: 'Total Private Sector'
      small_business: 'Small Business (1-49 employees)'
      medium_business: 'Medium Business (50-499 employees)'
      large_business: 'Large Business (500+ employees)'
  dataset_integration:
    column_mappings:
      ism_services_pmi: 'services_pmi_value'
      consumer_confidence_index: 'consumer_confidence_level'
      adp_employment_change: 'adp_jobs_change'
    feature_engineering:
      services_expansion_feature: 'services_pmi_value > 50.0'
      consumer_optimism_feature: 'consumer_confidence_level > 100.0'
      employment_growth_feature: 'adp_jobs_change > 100000'
  module_integration:
    context_builder:
      enabled: true
      categories:
        ism_services_pmi: 'services_activity'
        consumer_confidence_index: 'consumer_sentiment'
        adp_employment_change: 'employment_change'
    noise_filter:
      enabled: true
    adaptive_filter:
      enabled: true
