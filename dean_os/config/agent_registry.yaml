    decision_influence: false
    execution_group: macro_policy_domain_analysis
    run_phases:
      - pre_trade
    hypothesis_journal_path: data/dean_os/system_journal.jsonl

  pipeline_manager:
    class_path: dean_os.agents.pipeline_manager:PipelineManagerAgent
    branch: pipeline
    veto_level: none
    # Disabled by default: this composite duplicates semiconductor_analyst
    # (standalone, below) for the same domain_id. semiconductor_analyst
    # already has real artifact paths wired (news/macro/fundamental/
    # sector_market/runtime); pipeline_manager has none configured. Enable
    # this INSTEAD of semiconductor_analyst, never alongside it -- the
    # execution_group below makes the registry's own exclusive-group check
    # (_validate_exclusive_groups) enforce that if someone flips this on.
    enabled: false
    error_behavior: skip
    timeout_seconds: 30
    domain_id: semiconductor_ai_infrastructure
    horizon_days: 180
    agent_role: composite_domain_pipeline_manager
    decision_influence: false
    execution_group: semiconductor_domain_analysis
    run_phases:
      - pre_trade
    execution_group: semiconductor_domain_pipeline_manager
    run_phases:
      - pre_trade
    runtime_path: reports/dean_os/semiconductor_analyst_runtime_current/latest.json
    feature_timeframe_audit_path: reports/dean_os/pipeline_stage23_regeneration_nvda_review600/feature_timeframe_audit/latest.json
    target_readiness_path: reports/dean_os/pipeline_target_readiness_audit_nvda_review600/latest.json
    stage4_review_path: reports/dean_os/pipeline_stage4_exact_context_review_nvda_15m_review600/latest.json
    prediction_review_path: reports/dean_os/pipeline_prediction_source_review_current/latest.json
    sector_to_ticker_review_path: reports/dean_os/sector_to_ticker_review_packet_current/latest.json
    output_dir: reports/dean_os/sector_pipeline_manager_semiconductor_current

  pipeline_audit:
    class_path: dean_os.agents.pipeline_audit:PipelineAuditAgent
    branch: pipeline
    veto_level: hard
    enabled: true
    error_behavior: block
    timeout_seconds: 30
    findings_path: audit_reports/findings.json
    required_inputs:
      - audit_reports/findings.json
      - audit_reports/triage_P0_P1.md
    max_findings_age_hours: 24
    blocker_severities:
      - P0
    caution_severities:
      - P1

  agent_evaluation_controller:
    class_path: dean_os.agents.agent_evaluation_controller:AgentEvaluationControllerAgent
    branch: pipeline
    veto_level: hard
    enabled: false
    error_behavior: block
    timeout_seconds: 10
    run_phases:
      - pre_trade
    trace_store_path: logs/dean_os/agent_run_traces.jsonl
    thresholds_version: agent_eval_thresholds_v1
    lookback_runs: 200
    min_reviewed_runs: 20
    min_schema_validity: 0.98
    min_source_grounding: 0.90
    min_task_success_rate: 0.70
    max_loop_rate: 0.05
    max_unsafe_action_attempts: 0
    block_on_unsafe: true

  data_quality:
    class_path: dean_os.agents.data_quality:DataQualityAgent
    branch: pipeline
    veto_level: hard
    enabled: true
    error_behavior: block
    timeout_seconds: 10
    max_missing_ratio: 0.25

  risk:
    class_path: dean_os.agents.risk:RiskAgent
    branch: pipeline
    veto_level: hard
    enabled: true
    error_behavior: block
    timeout_seconds: 10
    max_drawdown_limit: 0.20
    max_daily_var_95: 0.08
    max_gross_exposure: 1.0

  model_performance:
    class_path: dean_os.agents.model_performance:ModelPerformanceAgent
    branch: pipeline
    veto_level: soft
    enabled: false
    error_behavior: skip
    timeout_seconds: 10
    min_validation_score: 0.55
    min_sharpe: 0.0
    max_drawdown: 0.25
    min_sample_count: 50
    max_age_hours: 720
    performance_path: reports/dean_os/pipeline_control_metric_artifact_materializer_current/model_evaluation/latest.json
    evidence_chain_path: reports/dean_os/pipeline_control_real_metric_evidence_run_current/latest.json
    model_case_path: reports/dean_os/pipeline_model_case_packet_current/latest.json

  regime:
    class_path: dean_os.agents.regime:RegimeAgent
    branch: pipeline
    veto_level: soft
    enabled: true
    error_behavior: skip
    timeout_seconds: 10
    require_stage7_regime_review: true
    shadow_mode: true
    run_phases:
      - pre_trade
    close_col: close
    volume_col: volume

  context_synthesis:
    class_path: dean_os.agents.context_synthesis:ContextSynthesisAgent
    branch: pipeline
    veto_level: none
    enabled: true
    error_behavior: skip
    timeout_seconds: 10
    require_predecessor_data: true
    shadow_mode: true
    run_phases:
      - pre_trade
    max_as_of_skew_minutes: 60
    min_prediction_confidence: 0.5
    min_anomaly_score: 0.8

  tuning:
    class_path: dean_os.agents.tuning:TuningAgent
    branch: pipeline
    veto_level: none
    enabled: false
    proposal_only: true
    error_behavior: warn
    timeout_seconds: 10

  chief_review:
    class_path: dean_os.agents.chief_review:ChiefReviewAgent
    branch: pipeline
    veto_level: none
    enabled: false
    proposal_only: true
    error_behavior: warn
    timeout_seconds: 10
    autonomy_mode: paper_supervised

  paper_portfolio:
