    class_path: dean_os.agents.domain_analyst:DomainAnalystAgent
    branch: pipeline
    veto_level: none
    enabled: true
    error_behavior: skip
    timeout_seconds: 30
    domain_id: semiconductor_ai_infrastructure
    horizon_days: 180
    agent_role: standalone_domain_analysis
    decision_influence: false
    execution_group: semiconductor_domain_analysis
    run_phases:
      - pre_trade
    news_artifact_path: reports/dean_os/saved_semiconductor_news_evidence_producer_current/latest.json
    macro_artifact_path: reports/dean_os/saved_macro_evidence_producer_current/latest.json
    fundamental_artifact_path: reports/dean_os/saved_sec_fundamental_evidence_merger_current/latest.json
    sector_market_artifact_path: reports/dean_os/saved_sector_market_evidence_producer_current/latest.json
    runtime_artifact_path: reports/dean_os/semiconductor_analyst_runtime_current/latest.json
    hypothesis_journal_path: data/dean_os/system_journal.jsonl

