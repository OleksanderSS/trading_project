# Commands the prose docs reference that have no run_agent_*.py wrapper on disk.
#
# Purpose: make every such reference a recorded decision instead of silent drift.
# tests/dean_os/test_agent_cli_restore.py requires each command named in the prose
# docs to either exist as a file or appear here, so a NEW phantom command fails the
# suite while these known gaps stay visible and explained.
#
# "candidate" means a module whose NAME resembles the command. It is a lead, not a
# mapping. On 2026-08-13 an attempt to restore these wrappers by name similarity
# produced wrappers that ran the wrong builder entirely (a wrapper named
# pipeline_stage23_regeneration ran PipelineFeatureTimeframeAudit), so a candidate
# must be verified against the module's actual entrypoint before a wrapper is added.
# Removing an entry from this file is how a gap gets closed: add the verified
# wrapper, then delete its line here.

retired_commands:
