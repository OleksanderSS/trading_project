  run_agent_collector_inventory.py: >-
    Retired. CollectorInventoryAgent was archived 2026-07-24 for never being
    registered or instantiated. The scan it wrapped now lives in
    dean_os/collector_inventory_scan.py and runs in-process during
    MarketDataRefreshRunbook and SourceRoutingAgent, so no wrapper is needed.

