# strategy.yaml

thresholds:
  forecast:
    bullish: 0.01
    bearish: -0.01
  rsi:
    oversold: 30
    overbought: 70
  sentiment:
    positive: 0.2
    negative: -0.2

# ... (existing sections) ...

# --- New Section for Defining Market Phase ---
market_phase_definition:
  # Defines the indicators used to determine the phase.
  # These names should match the output of the feature engineering stage.
  indicators:
    price: "close"
    short_term_ma: "SMA_50"
    long_term_ma: "SMA_200"

  # Defines the rules for each phase, evaluated in order.
  rules:
    - phase: "bull"
      condition: "price > short_term_ma and short_term_ma > long_term_ma"
    - phase: "bear"
      condition: "price < short_term_ma and short_term_ma < long_term_ma"
    - phase: "neutral" # Default fallback
      condition: "True"

# --- New Section for Adjusting Predictions based on Context ---
context_prediction_adjustment:
  # Weights for different context features when adjusting predictions
  weights:
    market_phase: 0.3
    trend_alignment: 0.25
    macro_bias: 0.2
  
  # Multipliers to apply based on the value of the context feature
  multipliers:
    market_phase:
      bull: 1.1
      bear: 0.9
      neutral: 1.0
      unknown: 1.0

# --- Backtesting Settings ---
backtesting:
  initial_capital: 100000.0
  minimum_trade_value: 100.0
  transaction_costs:
    commission_pct: 0.001          # 10 bps a side. NOTE: research charges a per-share model in targets.yaml that comes to ~0.5 bps -- the two disagree by 10-21x and nothing reconciles them (#290)
    spread_pct: 0.0005
    slippage_pct: 0.0002
    # `market_impact_coefficient: 0.1` stood here from 06.09 to 08.09. It was
    # made visible rather than chosen -- the live model had been taking 0.1
    # from its own default -- and #290 left "0.1 or the 0.0001 below" open
    # because the answer is empirical. Measured 08.09: NEITHER.
    #
    # The formula is the square-root law, whose standard form carries a daily
    # volatility (`impact ~= Y * sigma * sqrt(participation)`) and this engine's
    # version did not, so the coefficient was standing in for one. Our panel's
    # median daily return sd is 0.0202, which makes 0.1 an implied Y of 4.95
    # and 0.0001 an implied Y of 0.005.
    #
    # So the constant is gone and sigma is used where the law puts it -- the
    # function is already given a per-name volatility and already scales its
    # slippage by it. What remains is dimensionless:
    #
    #   Y = 1.0, the conservative end of the O(1) range, so costs sit at the
    #   high side of what is plausible rather than the low one.
    #
    # WHAT THIS CHANGED, and it is the convenient direction, so it is stated
    # rather than buried: a $500 order costs 0.273% instead of 0.489%, a
    # $10,000 one 0.283% instead of 0.980%, and market impact falls from 74%
    # of the cost at $25,000 to 7.1%. It dominated only because the
    # coefficient was five times too large. The gap to the research model
    # (0.047%, R22) narrows from 10-21x to about 6x.
    #
    # R53 is untouched by all of this: it measured at EXACTLY zero costs and
    # the book still lost to simply owning the names. Zero stays zero.
    market_impact_y: 1.0
  # READ ONLY BY src/archive/backtesting/engine.py, which is dead. The live
  # TransactionCostModel never looks here, so this 0.0001 has never applied.
  #
  # Now settled (08.09): 0.0001 implies Y = 0.005 against the measured daily
  # sd of 0.0202 -- two hundred times cheaper than the square-root law it is
  # written in the shape of. It was not the right number either, and the
  # question is closed by measurement rather than by picking one of the two.
  #
  # The note here used to say "R24 measured impact directly". IT DOES NOT --
  # R24 is about price leverage and takes slippage as a flat 1bp per side. No
  # direct impact measurement existed in this project before 08.09, and saying
  # one did is how the question stayed open while looking answered.
  #
  # `volatility_factor: 0.5` is the closest thing here to being right: the
  # dead engine at least knew volatility belonged in the formula.
  market_impact:
    sqrt_coefficient: 0.0001
    volatility_factor: 0.5

# Risk management settings live in risk_management.yaml under
# strategy.risk_management (that's the path PortfolioManager/
# VirtualPortfolio/AdaptivePositionSizer actually read via
# config_manager.get_config('strategy.risk_management')). A
# top-level `risk_management:` block here would sit at a sibling
# path ('risk_management', not 'strategy.risk_management') that no
# code reads - confirmed via repo-wide grep before removing it.
