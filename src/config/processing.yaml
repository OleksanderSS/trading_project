# Configuration for data processing steps

stage_2_processing:
  requires: ['raw_data']

safe_fill:
  fill_with_zero:
    - "news_score"
    - "impact_score"
    - "reverse_impact"
    - "daily_sentiment"
    - "match_count"
    - "news_count"

data_preparation:
  test_size: 0.2
  seq_len: 10
  feature_columns:
    - "feature_rsi"
    - "feature_ema_cross"
    - "feature_volatility"
    - "feature_sentiment_score"
    - "feature_news_volume"
  targets_config:
    - name: "target_regression_1d"
      type: "regression"
      params:
        base_col: "close"
        shift: -1
    - name: "target_binary_1d_0_0"
      type: "classification_binary"
      params:
        base_col: "close"
        shift: -1
        threshold: 0.0
    - name: "target_multiclass_1d"
      type: "classification_multiclass"
      params:
        base_col: "close"
        shift: -1
        thresholds: [-0.01, 0.01]
    - name: "target_rsi_prediction_3d"
      type: "indicator_prediction"
      params:
        indicator_col: "RSI_14"
        shift: -3

# Налаштування стадії моделювання.
#
# Ця секція раніше не існувала в жодному конфізі, хоча
# src/pipeline/stages/modeling/orchestrator.py читає get_config('modeling').
# Виклик повертав None, тож УСІ чотири налаштування нижче мовчки падали в
# код-константи — змінити їх через конфіг було неможливо.
# Значення тут дорівнюють тим самим константам, тож поведінка не змінюється;
# змінюється лише те, що тепер їх можна налаштувати.
modeling:
  strategy: hybrid          # src.training.constants: стратегія тренування
  batch_size: 10            # BATCH_TRAINER_DEFAULT_BATCH_SIZE
  max_memory_gb: 12.0       # BATCH_TRAINER_DEFAULT_MAX_MEMORY_GB
  # test_size навмисно НЕ дублюється тут: він живе під data_preparation вище,
  # і PipelinePolicyManager.split_policy() резолвить його звідти.

# Секція, яку читає src/pipeline/stages/processing/orchestrator.py через
# get_config('processing'). Раніше її не існувало, тож filtering_config
# дорівнював None і IntelligentDataFilter працював БЕЗ конфігурації на
# кожному прогоні — а саме він вирішує, які дані взагалі входять у конвеєр.
# Значення нижче дорівнюють захардкодженим дефолтам у src/processing/filters/,
# тож поведінка не змінюється; змінюється те, що їх тепер можна налаштувати.
processing:
  filtering:
    # price_filter.py
    # 30, не 2: оцінка якості рахує стандартне відхилення, збіг
    # каденції та частку дублікатів — з двох барів це не має сенсу,
    # але такий ряд проходив гейт і оцінювався як достовірний.
    min_candles_per_timeframe: 30
    min_data_quality_score: 0.6
    # Поріг застосовується до z-оцінки ДОХІДНОСТЕЙ бар-до-бару.
    # Раніше рахувалось по рівнях ціни, і збій +30% за бар не
    # виявлявся на жодному тікері.
    anomaly_std_dev_threshold: 3
    max_gap_duration_hours: 24
    min_cadence_match_ratio: 0.60
    max_extreme_return_ratio: 0.01
    # news_filter.py
    news_title_min_len: 10
    news_content_min_len: 50
    # social_filter.py
    reddit_score_threshold: 1
    reddit_text_min_len: 10
  normalization: {}

# Читається src/pipeline/stages/prediction/orchestrator.py.
prediction:
  # Наскільки знижується впевненість, коли прогноз суперечить чемпіону.
  champion_contradiction_penalty: 0.7

# Читається src/main/modes/backtest.py.
backtest:
  walk_forward_validation: false
  walk_forward:
    in_sample_months: 12
    out_sample_months: 3
