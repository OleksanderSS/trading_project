# ============================================
# NOISE FILTER THRESHOLDS
# ============================================
# Пороги для визначення значущих змін показників у Context Map
# Якщо зміна < threshold → стан = 0 (без змін)
# Якщо зміна > threshold → стан = 1 (зростання)
# Якщо зміна < -threshold → стан = -1 (падіння)

noise_filter_thresholds:
  # ============================================
  # МАКРОЕКОНОМІЧНІ ПОКАЗНИКИ (FRED)
  # ============================================
  
  # Індекси волатильності та ризику
  VIX: 0.02           # 2% зміна індексу волатильності
  VVIX: 0.03          # 3% зміна волатильності VIX
  
  # Процентні ставки та облігації
  10Y_yield: 0.001    # 0.1% зміна дохідності 10-річних облігацій
  2Y_yield: 0.001     # 0.1% зміна дохідності 2-річних облігацій
  30Y_yield: 0.001    # 0.1% зміна дохідності 30-річних облігацій
  fed_rate: 0.0025    # 0.25% зміна ставки ФРС (базисний пункт)
  EFFR: 0.0025        # 0.25% зміна ефективної ставки федеральних фондів
  
  # Валюти
  DXY: 0.003          # 0.3% зміна індексу долара
  EURUSD: 0.003       # 0.3% зміна євро/долар
  USDJPY: 0.003       # 0.3% зміна долар/єна
  
  # Індекси та ETF
  SPY: 0.005          # 0.5% зміна S&P 500
  QQQ: 0.006          # 0.6% зміна NASDAQ-100
  DIA: 0.005          # 0.5% зміна Dow Jones
  IWM: 0.007          # 0.7% зміна Russell 2000 (малі компанії)
  
  # Товари
  GLD: 0.005          # 0.5% зміна золота
  SLV: 0.01           # 1% зміна срібла
  USO: 0.015          # 1.5% зміна нафти
  UNG: 0.02           # 2% зміна природного газу
  
  # Макроекономічні показники
  GDP: 0.01           # 1% зміна ВВП
  CPI: 0.002          # 0.2% зміна індексу споживчих цін
  PPI: 0.003          # 0.3% зміна індексу цін виробників
  PCE: 0.002          # 0.2% зміна особистих споживчих витрат
  unemployment: 0.001 # 0.1% зміна рівня безробіття
  payrolls: 0.005     # 0.5% зміна зайнятості
  retail_sales: 0.005 # 0.5% зміна роздрібних продажів
  industrial_production: 0.003 # 0.3% зміна промислового виробництва
  housing_starts: 0.01 # 1% зміна будівництва житла
  consumer_confidence: 0.02 # 2% зміна споживчої довіри
  PMI: 0.01           # 1% зміна індексу менеджерів з закупівель
  
  # Грошова маса та кредит
  M1: 0.005           # 0.5% зміна грошової маси M1
  M2: 0.003           # 0.3% зміна грошової маси M2
  credit_spread: 0.001 # 0.1% зміна кредитного спреду
  
  # ============================================
  # ТЕХНІЧНІ ІНДИКАТОРИ
  # ============================================
  
  # Momentum індикатори
  RSI: 0.05           # 5 пунктів RSI (0-100 шкала)
  RSI_14: 0.05
  RSI_7: 0.07
  RSI_21: 0.04
  Stochastic: 0.05    # 5 пунктів стохастика
  Stochastic_K: 0.05
  Stochastic_D: 0.05
  Williams_R: 0.05    # 5 пунктів Williams %R
  CCI: 0.1            # 10 пунктів Commodity Channel Index
  MFI: 0.05           # 5 пунктів Money Flow Index
  
  # Trend індикатори
  MACD: 0.01          # 1% зміна MACD
  MACD_signal: 0.01
  MACD_hist: 0.02
  ADX: 0.05           # 5 пунктів Average Directional Index
  DI_plus: 0.05
  DI_minus: 0.05
  Aroon_up: 0.1       # 10 пунктів Aroon
  Aroon_down: 0.1
  TRIX: 0.01          # 1% зміна TRIX
  
  # Moving Averages
  SMA: 0.005          # 0.5% зміна простої ковзної середньої
  SMA_20: 0.005
  SMA_50: 0.005
  SMA_200: 0.005
  EMA: 0.005          # 0.5% зміна експоненційної ковзної середньої
  EMA_12: 0.005
  EMA_26: 0.005
  EMA_50: 0.005
  WMA: 0.005          # 0.5% зміна зваженої ковзної середньої
  DEMA: 0.005         # 0.5% зміна подвійної EMA
  TEMA: 0.005         # 0.5% зміна потрійної EMA
  KAMA: 0.005         # 0.5% зміна Kaufman Adaptive MA
  
  # Volatility індикатори
  ATR: 0.05           # 5% зміна Average True Range
  ATR_14: 0.05
  BB_upper: 0.005     # 0.5% зміна верхньої смуги Боллінджера
  BB_middle: 0.005
  BB_lower: 0.005
  BB_width: 0.02      # 2% зміна ширини смуг Боллінджера
  BB_percent: 0.05    # 5% зміна %B (позиція в смугах)
  Keltner_upper: 0.005
  Keltner_middle: 0.005
  Keltner_lower: 0.005
  Donchian_upper: 0.005
  Donchian_middle: 0.005
  Donchian_lower: 0.005
  historical_volatility: 0.02 # 2% зміна історичної волатильності
  
  # Volume індикатори
  volume: 0.1         # 10% зміна об'єму
  OBV: 0.05           # 5% зміна On-Balance Volume
  AD: 0.05            # 5% зміна Accumulation/Distribution
  CMF: 0.05           # 5% зміна Chaikin Money Flow
  VWAP: 0.005         # 0.5% зміна Volume Weighted Average Price
  volume_ratio: 0.1   # 10% зміна відношення об'єму
  
  # ============================================
  # ЦІНИ ТІКЕРІВ
  # ============================================
  close: 0.005        # 0.5% зміна ціни закриття
  open: 0.005         # 0.5% зміна ціни відкриття
  high: 0.005         # 0.5% зміна максимальної ціни
  low: 0.005          # 0.5% зміна мінімальної ціни
  adj_close: 0.005    # 0.5% зміна скоригованої ціни
  
  # Похідні від цін
  returns: 0.005      # 0.5% зміна прибутковості
  log_returns: 0.005
  price_change: 0.005
  price_range: 0.01   # 1% зміна діапазону цін (high-low)
  
  # ============================================
  # СЕНТИМЕНТ ТА НОВИНИ
  # ============================================
  sentiment_score: 0.05      # 5% зміна сентименту (-1 до 1)
  news_sentiment: 0.05
  reddit_sentiment: 0.1      # 10% зміна Reddit сентименту (більш волатильний)
  twitter_sentiment: 0.1
  fear_greed_index: 0.02     # 2% зміна індексу страху/жадібності
  put_call_ratio: 0.05       # 5% зміна співвідношення пут/кол
  
  # ============================================
  # ПОХІДНІ ФІЧІ (DECAY, LAG, ROLLING)
  # ============================================
  decay: 0.01         # 1% зміна decay features
  lag: 0.005          # 0.5% зміна lag features
  rolling_mean: 0.005 # 0.5% зміна ковзного середнього
  rolling_std: 0.02   # 2% зміна ковзного стандартного відхилення
  rolling_min: 0.005
  rolling_max: 0.005
  rolling_median: 0.005
  ewm: 0.005          # 0.5% зміна експоненційно зваженого середнього
  
  # ============================================
  # ІНШІ ПОКАЗНИКИ
  # ============================================
  correlation: 0.05   # 5% зміна кореляції
  beta: 0.05          # 5% зміна бета-коефіцієнта
  alpha: 0.01         # 1% зміна альфа
  sharpe_ratio: 0.1   # 10% зміна коефіцієнта Шарпа
  sortino_ratio: 0.1
  max_drawdown: 0.01  # 1% зміна максимальної просадки

# ============================================
# ЧАСОВІ ПОКАЗНИКИ (НЕ ПОРІВНЮЮТЬСЯ)
# ============================================
# Ці показники просто нормалізуються, не порівнюються з попередніми значеннями
temporal_features:
  - hour              # 0-23
  - day_of_week       # 0-6
  - day_of_month      # 1-31
  - day_of_year       # 1-366
  - week_of_year      # 1-53
  - month_of_year     # 1-12
  - quarter           # 1-4
  - is_weekend        # 0 або 1

# ============================================
# НАЛАШТУВАННЯ
# ============================================
default_dynamic_threshold: 0.005  # 0.5% за замовчуванням для невідомих показників
noise_sensitivity: 1.5            # Множник для динамічного розрахунку порогу (IQR * sensitivity)
