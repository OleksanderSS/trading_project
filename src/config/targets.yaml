  # All seven are tautologies rather than forecasts. Tomorrow's SMA(20) is
  # 19/20 determined by closes already known today, so a model "predicting" it
  # is reading back its own inputs. The 2026-08-12 run made this visible:
  # target_sma_20_f1 and target_ema_20_f1 scored R2 0.9952-0.9997 and were
  # refused only because the promotion gate treats a near-perfect score as a
  # leak signature.
  #
  # The gate already refused them -- 21 refusals per run, "indicator_prediction
  # targets are measured but not promoted" -- but refusal happens AFTER
  # training, so every run paid to fit models that could never be promoted.
  #
  # Commented rather than deleted: they are legitimate as a diagnostic (an
  # indicator target that DOESN'T score near 1.0 says the feature pipeline is
  # broken), just not as trading targets. Uncomment to use them that way.
