  # # ===================================================================
  # # NEW: Additional Intraday Targets (15m timeframe)
  # # ===================================================================
  
  target_intraday_up_15m:
    type: "classification_binary"
    params:
      description: "Price goes up by > 0.1% in next 15min? (0=No, 1=Yes)"
      horizon: "15m"
      base_col: "close"
      shift: -1
      threshold: 0.001

  target_intraday_return_15m:
    type: "regression"
    params:
      description: "Future return over next 15min."
      horizon: "15m"
      base_col: "close"
      shift: -1
      adjust_for_costs: true
      transaction_costs: *ibkr_pro_tiered

  target_intraday_volatility_15m:
    type: "regression"
    params:
      # Було base_col: "high" без method — рахувалась майбутня дохідність
      # колонки high, а low не використовувалась узагалі, тобто ніякого
      # діапазону не було. Тепер method реалізований: середнє (high-low)/close
      # по наступних `window` барах.
      description: "Середній діапазон (high-low)/close за наступні 3 бари."
      horizon: "15m"
      base_col: "close"
      shift: -1
      method: "high_low_range"
      window: 3

  # ===================================================================
  # NEW: Additional Hourly Targets (60m timeframe)
  # ===================================================================
  
  target_hourly_up_1h:
    type: "classification_binary"
    params:
      description: "Price goes up by > 0.3% in next hour? (0=No, 1=Yes)"
      horizon: "1h"
      base_col: "close"
      shift: -4  # 4 × 15min = 1 hour
      threshold: 0.003

  target_hourly_return_1h:
    type: "regression"
    params:
      description: "Future return over next hour."
      horizon: "1h"
      base_col: "close"
      shift: -4
      adjust_for_costs: true
      transaction_costs: *ibkr_pro_tiered

  target_hourly_volume_spike_1h:
    type: "classification_binary"
    params:
      # compare_to раніше ігнорувався: порівняння йшло з обсягом ПОТОЧНОГО
      # бару, а поріг 2.0 як відносна зміна означав +200% (потроєння), а не
      # "2x". Тепер compare_to реалізований, і 2.0 читається як "удвічі більше
      # за середнє" — саме те, що каже опис.
      description: "Обсяг > 2x середнього за 20 барів у наступну годину? (0/1)"
      horizon: "1h"
      base_col: "volume"
      shift: -4
      threshold: 2.0
      compare_to: "average"
      window: 20

  target_hourly_breakout_1h:
    type: "classification_binary"
    params:
      # indicator_col раніше ігнорувався для classification_binary, тож ціль
      # була просто "чи ціна взагалі зросла за 4 бари" — 49.3% позитивних,
      # тобто підкидання монети, яке ще й дублювало target_hourly_up_1h.
      # Ім'я колонки тепер із суфіксом інтервалу (feature_orchestrator додає
      # `_{interval}`, а годинний інтервал у конвеєрі позначається як 60m).
      description: "Close піднімається вище поточної верхньої смуги Боллінджера
        протягом наступних 4 барів? (0/1)"
      horizon: "1h"
      base_col: "close"
      shift: -4
      indicator_col: "BB_Upper_60m"
      threshold: 0.0

  # ===================================================================
  # NEW: Additional Daily Targets (1d timeframe)
  # ===================================================================
  
  target_weekly_up_1w:
    type: "classification_binary"
    params:
      description: "Price goes up by > 3% in next week? (0=No, 1=Yes)"
      base_col: "close"
      shift: -7  # 7 days = 1 week
      threshold: 0.03

  # --- Cross-sectional: measured against the other names, not against drift ---
  #
  # Added 2026-08-20 because it is the one variant measurement preferred, and
  # the pipeline could not produce it. Walk-forward over 11 independent folds,
  # excess over passive holding, identical folds/features/model:
  #
  #     absolute target   6/11 folds   +0.00021   t 0.55
  #     relative target   9/11         +0.00132   t 2.78
  #
  # Confirmed against a criterion fixed in advance on test years 1999/2001/2003,
  # the only segment that took no part in choosing it: 3/3 positive. The
  # follow-up in docs/preregistration/2026-08-20_cross_sectional_regression.md
  # shows that as a PORTFOLIO it is worth about half a percent a year over
  # levering the same holding -- better, not a fortune.
  #
  # No adjust_for_costs. Harvesting a spread costs one round trip on the name
  # and another on the hedge if there is one, and which applies is the
  # strategy's decision. Baking cost into the label is what made the absolute
  # up-targets fire at 29.9% where the market's drift implies about 53%.
  target_relative_return_5d:
    type: "cross_sectional"
    params:
      description: "Five-day return minus the mean of every name at the same bar."
      base_col: "close"
      shift: -5
      method: "demean"
      min_names: 5

  # The decision is a RANKING -- buy the top share at each date -- so this
  # trains the model on the quantity it is actually judged by, and one outlier
  # cannot drag the benchmark the way it drags a mean.
  target_relative_rank_5d:
    type: "cross_sectional"
    params:
      description: "Percentile rank of the five-day return within its own bar."
      base_col: "close"
      shift: -5
      method: "rank"
      min_names: 5

  target_weekly_return_1w:
    type: "regression"
    params:
      description: "Future return over next week."
      base_col: "close"
      shift: -7
      adjust_for_costs: true
      transaction_costs: *ibkr_pro_tiered

  # УВАГА: method/window до 2026-07-30 не читались калькулятором, тож обидві
  # ці цілі рахувались як звичайна одноденна дохідність і були БАЙТ-У-БАЙТ
  # ідентичні одна одній та (з точністю до сталої) target_return_1d. Тепер
  # method реалізований, і вони справді різні сигнали.
  target_daily_trend_strength_1d:
    type: "regression"
    params:
      description: "Наскільки трендовими будуть наступні 20 днів: R² лінійної
        регресії close по forward-вікну. За побудовою в [0, 1], без напрямку —
        напрямок і величину дає target_daily_momentum_score_1d."
      base_col: "close"
      shift: -1
      method: "slope_strength"
      window: 20

  target_daily_momentum_score_1d:
    type: "regression"
    params:
      description: "Дохідність за наступні 10 днів (rate of change по
        forward-вікну), на відміну від одноденної target_return_1d."
      base_col: "close"
      shift: -1
      method: "rate_of_change"
      window: 10

  # ===================================================================
  # NEW: Volatility Spike Targets (Across Timeframes)
  # ===================================================================
  
  target_volatility_spike_1d:
    type: "classification_binary"
    params:
      description: "Volatility (ATR) spikes by > 10% in the next 1 day? (0=No, 1=Yes)"
      base_col: "ATR_14_1d"
      shift: -1
      # Поріг знижено 10% -> 3% на основі виміру, не на око. При 10%
      # частка позитивних була 1.04% (15m), 1.00% (60m), 2.11% (1d) — а
      # holdout Stage 4 має ~220 / ~174 / ~103 рядки, тобто очікувано
      # ОДИН-ДВА позитивні приклади на все вікно оцінки. Звідси
      # "holdout score 0.0000 does not beat the naive baseline 0.0000" на
      # кожному контексті: і модель, і baseline ловили порожнечу.
      #
      # Виміряно на батчі 2026-08-11 (метод звірено: перерахунок збігається
      # зі збереженим таргетом на 100%):
      #   поріг    15m     60m      1d
      #   10%     1.04%   1.00%   2.11%
      #    5%     4.93%   2.99%   7.96%
      #    3%     9.29%   5.63%  14.72%
      #
      # 3% обрано тому, що це >= медіани |зміни| ATR за один бар
      # (2.51% / 3.02% / 1.97%), тож позитив досі означає "зросла більше,
      # ніж за типовий бар", а не шум — але тепер у вікні оцінки є що ловити.
      # Наявний батч цим НЕ переписується: щоб побачити нову частоту,
      # потрібне перегенерування таргетів (стадії 0-3).
      threshold: 0.03

  target_volatility_spike_1h:
    type: "classification_binary"
    params:
      description: "Volatility (ATR) spikes by > 10% in the next 1 hour? (0=No, 1=Yes)"
      # ATR_14_60m, не _1h: feature_orchestrator додає суфікс `_{interval}`,
      # а годинний інтервал у конвеєрі позначається як 60m. З "_1h" ціль
      # падала з "Base column 'ATR_14_1h' not found" на кожному прогоні.
      base_col: "ATR_14_60m"
      shift: -1
      # Поріг знижено 10% -> 3% на основі виміру, не на око. При 10%
      # частка позитивних була 1.04% (15m), 1.00% (60m), 2.11% (1d) — а
      # holdout Stage 4 має ~220 / ~174 / ~103 рядки, тобто очікувано
      # ОДИН-ДВА позитивні приклади на все вікно оцінки. Звідси
      # "holdout score 0.0000 does not beat the naive baseline 0.0000" на
      # кожному контексті: і модель, і baseline ловили порожнечу.
      #
      # Виміряно на батчі 2026-08-11 (метод звірено: перерахунок збігається
      # зі збереженим таргетом на 100%):
      #   поріг    15m     60m      1d
      #   10%     1.04%   1.00%   2.11%
      #    5%     4.93%   2.99%   7.96%
      #    3%     9.29%   5.63%  14.72%
      #
      # 3% обрано тому, що це >= медіани |зміни| ATR за один бар
      # (2.51% / 3.02% / 1.97%), тож позитив досі означає "зросла більше,
      # ніж за типовий бар", а не шум — але тепер у вікні оцінки є що ловити.
      # Наявний батч цим НЕ переписується: щоб побачити нову частоту,
      # потрібне перегенерування таргетів (стадії 0-3).
      threshold: 0.03

  target_volatility_spike_15m:
    type: "classification_binary"
    params:
      description: "Volatility (ATR) spikes by > 10% in the next 15 mins? (0=No, 1=Yes)"
      base_col: "ATR_14_15m"
      shift: -1
      # Поріг знижено 10% -> 3% на основі виміру, не на око. При 10%
      # частка позитивних була 1.04% (15m), 1.00% (60m), 2.11% (1d) — а
      # holdout Stage 4 має ~220 / ~174 / ~103 рядки, тобто очікувано
      # ОДИН-ДВА позитивні приклади на все вікно оцінки. Звідси
      # "holdout score 0.0000 does not beat the naive baseline 0.0000" на
      # кожному контексті: і модель, і baseline ловили порожнечу.
      #
      # Виміряно на батчі 2026-08-11 (метод звірено: перерахунок збігається
      # зі збереженим таргетом на 100%):
      #   поріг    15m     60m      1d
      #   10%     1.04%   1.00%   2.11%
      #    5%     4.93%   2.99%   7.96%
      #    3%     9.29%   5.63%  14.72%
      #
      # 3% обрано тому, що це >= медіани |зміни| ATR за один бар
      # (2.51% / 3.02% / 1.97%), тож позитив досі означає "зросла більше,
      # ніж за типовий бар", а не шум — але тепер у вікні оцінки є що ловити.
      # Наявний батч цим НЕ переписується: щоб побачити нову частоту,
      # потрібне перегенерування таргетів (стадії 0-3).
      threshold: 0.03

