
# /src/config/targets.yaml
# Defines all possible target variables that can be generated for model training.

targets:
  # ===================================================================
  # Targets for "Heavy" Models (LSTM, GRU, Transformer, CNN)
  # Focus: Predicting the direction and magnitude of price movements.
  # ===================================================================

  # --- Binary Classification Targets ---
  target_up_1d:
    type: "classification_binary"
    params:
      description: "Price goes up by > 0.5% in the next 1 period? (0=No, 1=Yes)"
      base_col: "close"
      shift: -1
      threshold: 0.005

  target_up_5d:
    type: "classification_binary"
    params:
      description: "Price goes up by > 2% in the next 5 periods? (0=No, 1=Yes)"
      base_col: "close"
      shift: -5
      threshold: 0.02

  # --- Multiclass Classification Targets ---
  target_multi_1d:
    type: "classification_multiclass"
    params:
      description: "Price movement in 1 period vs 1% thold (0=Down, 1=Flat, 2=Up)"
      base_col: "close"
      shift: -1
      thresholds: [-0.01, 0.01]

  target_multi_5d:
    type: "classification_multiclass"
    params:
      description: "Price movement in 5 periods vs 3% thold (0=Down, 1=Flat, 2=Up)"
      base_col: "close"
      shift: -5
      thresholds: [-0.03, 0.03]

  # ===================================================================
  # Targets for "Light" Models (LGBM, XGBoost, RF, Linear, etc.)
  # Focus: Predicting the future value of specific technical indicators.
  # ===================================================================

  # --- Regression (Price-based) ---
  target_return_1d:
    type: "regression"
    params:
      description: "Future return over the next 1 period."
      base_col: "close"
      shift: -1
      # ✅ Accounting for margin (commission) in target
      adjust_for_costs: true
      transaction_costs:
        commission_pct: 0.001  # 0.1% commission
        spread_pct: 0.0005     # 0.05% spread
        slippage_pct: 0.001    # 0.1% slippage
        # Total margin: ~0.25% per operation (buy+sell = 0.5%)

  target_return_5d:
    type: "regression"
    params:
      description: "Future return over the next 5 periods."
      base_col: "close"
      shift: -5
      adjust_for_costs: true
      transaction_costs:
        commission_pct: 0.001
        spread_pct: 0.0005
        slippage_pct: 0.001

  # --- Indicator Prediction ---
  target_rsi_14_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future value of RSI(14) in 1 period."
      indicator_col: "RSI_14"
      shift: -1

  target_sma_20_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future value of SMA(20) in 1 period."
      indicator_col: "SMA_20"
      shift: -1

  target_ema_20_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future value of EMA(20) in 1 period."
      indicator_col: "EMA_20"
      shift: -1

  target_macd_hist_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future value of MACD Histogram in 1 period."
      indicator_col: "MACD_Histogram"
      shift: -1

  target_atr_14_f5:
    type: "indicator_prediction"
    params:
      description: "Predict future value of ATR(14) in 5 periods."
      indicator_col: "ATR_14"
      shift: -5

  target_bb_upper_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future value of Upper Bollinger Band in 1 period."
      indicator_col: "BB_Upper"
      shift: -1

  target_volume_ratio_f1:
    type: "indicator_prediction"
    params:
      description: "Predict future Volume Ratio in 1 period."
      indicator_col: "market_context_volume_ratio"  # Виправлено назву
      shift: -1

  # ===================================================================
  # NEW: Additional Intraday Targets (15m timeframe)
  # ===================================================================
  
  target_intraday_up_15m:
    type: "classification_binary"
    params:
      description: "Price goes up by > 0.1% in next 15min? (0=No, 1=Yes)"
      base_col: "close"
      shift: -1
      threshold: 0.001

  target_intraday_return_15m:
    type: "regression"
    params:
      description: "Future return over next 15min."
      base_col: "close"
      shift: -1
      adjust_for_costs: true
      transaction_costs:
        commission_pct: 0.001
        spread_pct: 0.0005
        slippage_pct: 0.001

  target_intraday_volatility_15m:
    type: "regression"
    params:
      description: "Predict volatility in next 15min (via high-low range as proxy)."
      base_col: "high"
      shift: -1
      window: 3

  # ===================================================================
  # NEW: Additional Hourly Targets (60m timeframe)
  # ===================================================================
  
  target_hourly_up_1h:
    type: "classification_binary"
    params:
      description: "Price goes up by > 0.3% in next hour? (0=No, 1=Yes)"
      base_col: "close"
      shift: -4  # 4 × 15min = 1 hour
      threshold: 0.003

  target_hourly_return_1h:
    type: "regression"
    params:
      description: "Future return over next hour."
      base_col: "close"
      shift: -4
      adjust_for_costs: true
      transaction_costs:
        commission_pct: 0.001
        spread_pct: 0.0005
        slippage_pct: 0.001

  target_hourly_volume_spike_1h:
    type: "classification_binary"
    params:
      description: "Volume spike > 2x average in next hour? (0=No, 1=Yes)"
      base_col: "volume"
      shift: -4
      threshold: 2.0
      compare_to: "average"

  target_hourly_breakout_1h:
    type: "classification_binary"
    params:
      description: "Price breaks Bollinger Bands in next hour? (0=No, 1=Yes)"
      base_col: "close"
      shift: -4
      indicator_col: "BB_Upper"
      threshold: 0.0

  # ===================================================================
  # NEW: Additional Daily Targets (1d timeframe)
  # ===================================================================
  
  target_weekly_up_1w:
    type: "classification_binary"
    params:
      description: "Price goes up by > 3% in next week? (0=No, 1=Yes)"
      base_col: "close"
      shift: -7  # 7 days = 1 week
      threshold: 0.03

  target_weekly_return_1w:
    type: "regression"
    params:
      description: "Future return over next week."
      base_col: "close"
      shift: -7
      adjust_for_costs: true
      transaction_costs:
        commission_pct: 0.001
        spread_pct: 0.0005
        slippage_pct: 0.001

  target_daily_trend_strength_1d:
    type: "regression"
    params:
      description: "Trend strength score (0-1) for next day."
      base_col: "close"
      shift: -1
      method: "slope_strength"
      window: 20

  target_daily_momentum_score_1d:
    type: "regression"
    params:
      description: "Momentum score for next day."
      base_col: "close"
      shift: -1
      method: "rate_of_change"
      window: 10