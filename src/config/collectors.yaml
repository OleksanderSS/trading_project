collectors:
  yahoo_finance:
    enabled: true
    type: "yahoo_finance"
    critical: true
    table_name: "market_data_raw"
    cache_ttl: 900
    cache_duration_minutes: 15
    timeframes:
      "15m":
        period: "60d"
      "60m":
        period: "60d"
      "1d":
        period: "2y"

  fred:
    enabled: true
    type: "fred"
    critical: false
    table_name: "fred_data"
    cache_ttl: 86400
    cache_duration_minutes: 1440
    hash_keys: ["series_id", "date"]
    params:
      period: "2y"
      series_ids:
        # --- Монетарна політика ---
        - "FEDFUNDS"           # Federal Funds Rate
        - "DGS10"              # 10-Year Treasury Yield
        - "GS10"               # 10-Year Constant Maturity
        - "GS2"                # 2-Year Constant Maturity
        - "T10Y2Y"             # Yield Curve Spread (10Y-2Y)

        # --- Інфляція ---
        - "CPIAUCSL"           # CPI (All Urban)
        - "PCEPILFE"           # Core PCE (офіційний таргет ФРС)
        - "PCEPI"              # Total PCE
        - "PPIACO"             # PPI (All Commodities)

        # --- Ринок праці ---
        - "UNRATE"             # Unemployment Rate
        - "PAYEMS"             # Nonfarm Payrolls (випереджаючий)
        - "CCSA"               # Continuing Jobless Claims (щотижневий)
        - "MANEMP"             # Manufacturing Employment

        # --- Зростання економіки ---
        - "GDP"                # Gross Domestic Product
        - "INDPRO"             # Industrial Production Index
        - "CAPUTLB50001SQ"     # Capacity Utilization
        - "DGORDER"            # Durable Goods Orders
        - "TOTALSA"            # Total Vehicle Sales
        - "RSAFS"              # Retail Sales

        # --- Настрої ---
        - "UMCSENT"            # Consumer Sentiment (Michigan)
        - "VIXCLS"             # VIX

        # --- Нерухомість (випереджаючий) ---
        - "HOUST"              # Housing Starts
        - "PERMIT"             # Building Permits

        # --- Фінансові умови ---
        - "TEDRATE"            # TED Spread (ранній індикатор кризи)
        - "BAMLH0A0HYM2"       # High Yield Spread
        - "WALCL"              # Fed Balance Sheet

        # --- Валюти та товари ---
        - "DEXUSEU"            # USD/EUR
        - "DEXCHUS"            # USD/CNY
        - "DCOILWTICO"         # WTI Oil Price

        # --- Доходи ---
        - "DSPIC96"            # Real Disposable Personal Income

      max_retries: 3

  google_news:
    enabled: true
    type: "google_news"
    critical: false
    table_name: "google_news"
    cache_ttl: 3600
    cache_duration_minutes: 60
    max_concurrent_terms: 5
    delay: 0.3
    filter:
      min_source_quality: 0.4
      require_keywords_in_title: false
      exclude_title_keywords:
        - "horoscope"
        - "celebrity"
        - "sports score"
        - "weather"
        - "recipe"
      allowed_domains: []
    params:
      period: "7d"
      language: "en"
      country: "US"
      max_results: 10
    deduplication:
      n_clusters: 10
      max_features: 500

  rss:
    enabled: true
    type: "rss"
    critical: false
    table_name: "rss_news"
    cache_ttl: 3600
    cache_duration_minutes: 60
    filter:
      min_source_quality: 0.4
      require_keywords_in_title: false
      exclude_title_keywords:
        - "horoscope"
        - "celebrity"
        - "sports"
    params:
      period: "7d"
      limit_per_feed: 20
    deduplication:
      n_clusters: 10
      max_features: 300

  newsapi:
    enabled: true
    type: "newsapi"
    critical: false
    table_name: "newsapi_articles"
    cache_ttl: 3600
    cache_duration_minutes: 60
    requires_api_key: true
    api_key_env: "NEWS_API_KEY"
    base_url: "https://newsapi.org/v2/everything"
    language: "en"
    page_size: 20
    hash_keys: ["url", "publishedAt"]
    filter:
      min_source_quality: 0.4
      exclude_title_keywords:
        - "horoscope"
        - "celebrity"

  economic_calendar:
    enabled: false
    type: "economic_calendar"
    critical: false
    table_name: "economic_calendar"
    cache_ttl: 86400
    cache_duration_minutes: 1440
    api_url: "https://sb-inv-prod.investing.com/api/economic-calendar/v1/events"
    days_back: 7
    days_ahead: 30
    countries: ["us", "eu", "gb", "cn", "jp", "de"]
    importance: ["medium", "high"]

  free_google_trends:
    enabled: false
    type: "free_google_trends"
    critical: false
    table_name: "google_trends_data"
    cache_ttl: 7200
    cache_duration_minutes: 120
    geo: "US"
    timeframe: "today 1-m"
    language: "en-US"
    batch_size: 4
    request_delay_seconds: 5

  sec_filings:
    enabled: true
    type: "sec_filings"
    critical: false
    table_name: "sec_filings"
    cache_ttl: 14400
    cache_duration_minutes: 240
    submissions_url_template: "https://data.sec.gov/submissions/CIK{cik}.json"
    hash_keys: ["accessionNumber", "cik"]
    params:
      period: "60d"

  insider:
    enabled: false
    type: "insider"
    critical: false
    table_name: "insider_trades"
    cache_ttl: 14400
    cache_duration_minutes: 240
    hash_keys: ["filing_date", "ticker", "insider_name"]

  hugging_face:
    enabled: false
    type: "hugging_face"
    critical: false
    table_name: "huggingface_data"
    cache_ttl: 604800
    cache_duration_minutes: 10080
    dataset_name: "financial_news"
    subset_name: null
    split: "train"

  bigquery:
    enabled: false
    type: "bigquery"
    critical: false
    table_name: "bigquery_data"

  custom_csv:
    enabled: false
    type: "custom_csv"
    critical: false