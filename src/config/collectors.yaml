collectors:
  yahoo_finance:
    enabled: true
    type: yahoo_finance
    critical: true
    table_name: market_data_raw
    cache_ttl: 900
    cache_duration_minutes: 15
    timeframes:
      15m:
        period: 60d
      60m:
        period: 60d
      1d:
        period: 2y
  fred:
    enabled: true
    type: fred
    critical: false
    table_name: fred_data
    cache_ttl: 86400
    cache_duration_minutes: 1440
    hash_keys:
    - series_id
    - date
    params:
      period: 2y
      series_ids:
      - FEDFUNDS
      - DGS10
      - GS10
      - GS2
      - T10Y2Y
      - CPIAUCSL
      - PCEPILFE
      - PCEPI
      - PPIACO
      - UNRATE
      - PAYEMS
      - CCSA
      - MANEMP
      - GDP
      - INDPRO
      - CAPUTLB50001SQ
      - DGORDER
      - TOTALSA
      - RSAFS
      - UMCSENT
      - VIXCLS
      - HOUST
      - PERMIT
      - TEDRATE
      - BAMLH0A0HYM2
      - WALCL
      - DEXUSEU
      - DEXCHUS
      - DCOILWTICO
      - DSPIC96
      max_retries: 3
  google_news:
    enabled: true
    type: google_news
    data_type: news
    critical: false
    table_name: google_news
    cache_ttl: 3600
    cache_duration_minutes: 60
    max_concurrent_terms: 5
    delay: 0.3
    filter:
      min_source_quality: 0.0
      require_keywords_in_title: false
      exclude_title_keywords:
      - horoscope
      - celebrity
      - sports score
      - weather
      - recipe
      allowed_domains: []
    params:
      period: 60d
      language: en
      country: US
      max_results: 10
    deduplication:
      n_clusters: 10
      max_features: 500
  rss:
    enabled: true
    type: rss
    data_type: news
    critical: false
    table_name: rss_news
    cache_ttl: 3600
    cache_duration_minutes: 60
    filter:
      min_source_quality: 0.0
      require_keywords_in_title: false
      exclude_title_keywords:
      - horoscope
      - celebrity
      - sports
    params:
      period: 60d
      limit_per_feed: 20
    deduplication:
      n_clusters: 10
      max_features: 300
  newsapi:
    enabled: true
    type: newsapi
    data_type: news
    critical: false
    table_name: newsapi_articles
    cache_ttl: 3600
    cache_duration_minutes: 60
    requires_api_key: true
    api_key_env: NEWS_API_KEY
    base_url: https://newsapi.org/v2/everything
    language: en
    page_size: 20
    hash_keys:
    - url
    - publishedAt
    filter:
      min_source_quality: 0.4
      exclude_title_keywords:
      - horoscope
      - celebrity
  economic_calendar:
    enabled: false
    type: economic_calendar
    critical: false
    table_name: economic_calendar
    cache_ttl: 86400
    cache_duration_minutes: 1440
    api_url: https://sb-inv-prod.investing.com/api/economic-calendar/v1/events
    days_back: 7
    days_ahead: 30
    countries:
    - us
    - eu
    - gb
    - cn
    - jp
    - de
    importance:
    - medium
    - high
  free_google_trends:
    enabled: false
    type: free_google_trends
    critical: false
    table_name: google_trends_data
    cache_ttl: 7200
    cache_duration_minutes: 120
    geo: US
    timeframe: today 1-m
    language: en-US
    batch_size: 4
    request_delay_seconds: 5
  sec_filings:
    enabled: false
    type: sec_filings
    critical: false
    table_name: sec_filings
    cache_ttl: 14400
    cache_duration_minutes: 240
    submissions_url_template: https://data.sec.gov/submissions/CIK{cik}.json
    hash_keys:
    - accessionNumber
    - cik
    params:
      period: 60d
  insider:
    enabled: false
    type: insider
    critical: false
    table_name: insider_trades
    cache_ttl: 14400
    cache_duration_minutes: 240
    hash_keys:
    - filing_date
    - ticker
    - insider_name
    urls:
    - https://openinsider.com/screener
    column_mapping:
      col_0: filing_date
      col_1: ticker
      col_2: insider_name
      col_3: transaction_type
      col_4: shares
      col_5: price
    user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  hugging_face:
    enabled: true
    type: huggingface
    critical: false
    table_name: huggingface_data
    cache_ttl: 604800
    cache_duration_minutes: 10080
    dataset_name: wikitext
    subset_name: wikitext-103-v1
    split: train
    hash_keys:
    - text
  bigquery:
    enabled: false
    type: bigquery
    critical: false
    table_name: bigquery_data
  custom_csv:
    enabled: false
    type: custom_csv
    critical: false
  alternative_me:
    enabled: true
    type: alternative_me
    data_type: alternative
    critical: false
    table_name: fear_greed_data
    cache_ttl: 3600
    cache_duration_minutes: 60
    hash_keys:
    - date
    - value
    base_url: https://api.alternative.me
    timeout: 30
    params:
      limit: 100
  vix:
    enabled: true
    type: vix
    data_type: alternative
    critical: false
    table_name: vix_data
    cache_ttl: 3600
    cache_duration_minutes: 60
    hash_keys:
    - date
    - vix_current
    - volatility_regime
    ticker: ^VIX
    timeout: 30
    params:
      period: 60d
      interval: 1d
  put_call_ratio:
    enabled: false  # Вимкнено: зараз генерує синтетичні дані через помилку підключення до CBOE
    type: put_call_ratio
    data_type: alternative
    critical: false
    table_name: put_call_ratio_data
    cache_ttl: 3600
    cache_duration_minutes: 60
    hash_keys:
    - date
    - put_call_ratio
    - sentiment_signal
    base_url: https://www.cboe.com
    timeout: 30
  cftc:
    enabled: false  # Вимкнено: URL застарілі (404)
    type: cftc
    data_type: alternative
    critical: false
    table_name: cftc_data
    cache_ttl: 86400
    cache_duration_minutes: 1440
    hash_keys:
    - date
    - instrument
    - net_position
    base_url: https://www.cftc.gov
    timeout: 30
    instruments:
    - S&P
    - NASDAQ
    - DOW
    - GOLD
    - CRUDE OIL
  aaii_sentiment:
    enabled: false
    type: aaii_sentiment
    data_type: alternative
    critical: false
    table_name: aaii_sentiment_data
    cache_ttl: 86400
    cache_duration_minutes: 1440
    hash_keys:
    - date
    - bullish
    - bearish
    - neutral
    timeout: 30
  fear_greed:
    enabled: false
    type: fear_greed
    data_type: alternative
    critical: false
    table_name: fear_greed_data
    cache_ttl: 3600
    cache_duration_minutes: 60
    hash_keys:
    - date
    - fear_greed_index
    - classification
    base_url: https://production.datapoint.cloud/api/fear-greed
    timeout: 30
  reddit_sentiment:
    enabled: false
    type: reddit_sentiment
    data_type: alternative
    critical: false
    table_name: reddit_sentiment_data
    cache_ttl: 3600
    cache_duration_minutes: 60
    hash_keys:
    - date
    - sentiment_score
    - viral_posts
    subreddits:
    - wallstreetbets
    - stocks
    - investing
    timeout: 30
    use_synthetic_data: true
