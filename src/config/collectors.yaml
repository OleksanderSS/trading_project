collectors:
  aaii_sentiment:
    # Disabled 2026-08-12: AAII answers HTTP 403 to this project's user agent
    # — a deliberate block on automated access to a survey behind a paid
    # membership, not a misconfiguration, and not worked around here. It had
    # been enabled and delivering nothing since at least 2026-08-11 while the
    # collection summary counted it as successfully processed. Its HTML parser
    # is broken independently (the date pattern reads "August 6, 2026" as
    # "ust 6, 2026"), so re-enabling needs a licensed source, not a retry.
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: false
    hash_keys:
    - date
    - bullish
    - bearish
    - neutral
    table_name: aaii_sentiment_data
    type: aaii_sentiment
  bigquery:
    credentials_path: D:/trading_project/credentials/gcp_credentials.json
    critical: false
    enabled: false
    essential_columns:
    - date
    - ticker
    - close
    - volume
    - high
    - low
    - open
    hash_keys:
    - date
    - ticker
    max_days: 90
    max_rows: 10000
    project_id: seismic-vista-470410-i5
    query: "SELECT\n  date,\n  ticker,\n  close,\n  volume,\n  high,\n  low,\n  open\n\
      FROM `seismic-vista-470410-i5.market_data.daily_prices`\nWHERE date >= DATE_SUB(CURRENT_DATE(),\
      \ INTERVAL 90 DAY)\nAND ticker IN UNNEST(@tickers)\nLIMIT 10000\n"
    table_name: bigquery_data
    type: bigquery
  cftc:
    allow_sample_fallback: false
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: true
    hash_keys:
    - date
    - instrument
    - net_position
    table_name: cftc_data
    type: cftc
  custom_csv:
    critical: false
    data_type: macro_context
    date_column: date
    enabled: false
    encoding: utf-8
    file_path: data/macro_context/news_patterns.csv
    table_name: news_patterns
    type: custom_csv
  economic_calendar:
    api_url: https://sb-inv-prod.investing.com/api/economic-calendar/v1/events
    backoff_factor: 2.0
    cache_duration_minutes: 1440
    cache_ttl: 86400
    countries:
    - us
    - eu
    - gb
    - cn
    - jp
    - de
    critical: false
    days_ahead: 30
    days_back: 7
    enabled: true
    filter:
      exclude_title_keywords:
      - horoscope
      - celebrity
      - sports score
      - weather
      - recipe
      min_source_quality: 0.4
      require_keywords_in_title: false
    hash_keys:
    # `actual` joined the key on 2026-08-15. An event is fetched BEFORE its
    # release, when actual is empty, and again after it prints. With the key
    # limited to (timestamp, country, event) the second fetch hashed
    # identically, filter_new_records dropped it as a duplicate, and the
    # actual figure was never stored at all: all 147 rows in the table carry
    # an empty `actual` while 101 carry a forecast.
    #
    # That made the surprise -- actual minus forecast, the only thing this
    # source is for -- impossible to compute by construction.
    #
    # Keying on actual keeps BOTH snapshots as separate rows, which is the
    # same decision already taken for FRED vintages: a figure before its
    # release and the same figure after it are two facts, not one fact stored
    # twice. Consumers take the row that has an actual; the pre-release row
    # remains as the record of what was expected.
    - timestamp
    - country
    - event
    - actual
    headers:
      Accept: application/json, text/plain, */*
      Content-Type: application/x-www-form-urlencoded
      Origin: https://www.investing.com
      Referer: https://www.investing.com/economic-calendar/
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
        like Gecko) Chrome/120.0.0.0 Safari/537.36
      X-Requested-With: XMLHttpRequest
    importance:
    - medium
    - high
    max_retries: 5
    params:
      country: us
      language: en
      max_results: 5
      period: 7d
    retry_delay: 1.0
    table_name: economic_calendar
    time_zone: '5'
    timeout: 60
    type: economic_calendar
  fear_greed:
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: true
    # These named columns the collector does not produce. It emits date,
    # value, timestamp, fear_greed_category and fear_greed_signal, so the
    # unique index could not be built and every save failed with
    #   Binder Error: Table "fear_greed_data" does not have a column
    #   named "fear_greed_index"
    # — invisible until the endpoint was repaired on 2026-08-12 and the
    # collector reached the save path for the first time.
    hash_keys:
    - date
    - value
    - fear_greed_category
    table_name: fear_greed_data
    type: fear_greed
  fred:
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: true
    hash_keys:
    - series_id
    - date
    - realtime_start
    - value
    params:
      max_retries: 3
      period: 2y
      series_ids:
      - FEDFUNDS
      - DGS10
      - GS10
      - GS2
      - T10Y2Y
      - CPIAUCSL
      - PCEPILFE
      - PCEPI
      - PPIACO
      - UNRATE
      - PAYEMS
      - CCSA
      - MANEMP
      - GDP
      - INDPRO
      - CAPUTLB50001SQ
      - DGORDER
      - TOTALSA
      - RSAFS
      - UMCSENT
      - VIXCLS
      - HOUST
      - PERMIT
      # TEDRATE видалено: FRED припинив серію в січні 2022 (відхід від LIBOR),
      # 0 рядків у fred_data. Кредитний стрес тепер покривають спреди нижче.
      - BAMLH0A0HYM2
      - WALCL
      - DEXUSEU
      - DEXCHUS
      - DCOILWTICO
      - DSPIC96
      # --- Інфляційні очікування (що ринок ОЧІКУЄ, а не що вже сталося) ---
      - T5YIE
      - T10YIE
      - T5YIFR
      # --- Спред 10р-3м: передбачає рецесії краще за T10Y2Y (Estrella/Mishkin) ---
      - T10Y3M
      # --- Чиста ліквідність = WALCL - TGA - RRP; сам WALCL вводить в оману ---
      - WTREGEN
      - RRPONTSYD
      # --- Фінансові умови та якісний кредитний спред ---
      # NFCI: тижневий, агрегує 100+ входів. BAMLC0A0CM: investment-grade спред
      # (був лише high-yield) — разом показують, чи стрес вийшов за межі сміття.
      - NFCI
      - BAMLC0A0CM
      # --- Ринок праці: первинні заявки (тижневі, оперативніші за CCSA) ---
      - ICSA
      - SAHMREALTIME
      # --- Галузеві індикатори для Лінз ---
      - CSUSHPINSA
      - WPU01
      - WPU0561
      - WPU055
      - WPU101
      - PCU334413334413
    table_name: fred_data
    type: fred
  free_google_trends:
    base_delay: 10
    batch_delay_max: 75
    batch_delay_min: 45
    batch_size: 4
    cache_duration_minutes: 120
    cache_ttl: 7200
    critical: false
    enabled: false
    geo: US
    language: en-US
    max_delay: 300
    max_retries: 5
    min_batch_size: 1
    request_delay_seconds: 5
    table_name: google_trends_data
    timeframe: today 1-m
    type: free_google_trends
  google_news:
    cache_duration_minutes: 60
    cache_ttl: 3600
    critical: false
    deduplication:
      max_features: 500
      n_clusters: 10
    enabled: true
    filter:
      allowed_domains: []
      exclude_title_keywords:
      - horoscope
      - celebrity
      - sports score
      - weather
      - recipe
      min_source_quality: 0.4
      require_keywords_in_title: false
    hash_keys:
    - link
    headers:
      Accept: application/rss+xml, application/xml, text/xml, */*
      Accept-Language: en-US,en;q=0.9
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
        like Gecko) Chrome/120.0.0.0 Safari/537.36
    max_concurrent_terms: 5
    max_terms: 30
    params:
      country: US
      language: en
      max_results: 5
      period: 7d
    table_name: google_news
    timeout: 500
    type: google_news
  huggingface:
    cache_duration_minutes: 10080
    cache_ttl: 604800
    critical: false
    dataset_name: zeroshot/twitter-financial-news-topic
    enabled: true
    essential_columns:
    - date
    - text
    - label
    - sentiment
    - timestamp
    filter_by_keywords: true
    hf_token: ${HF_TOKEN}
    keywords_categories:
    - market_terms
    - finance_economy
    - sectors_tech
    max_days: 90
    max_rows: 10000
    split: train
    subset_name: null
    table_name: huggingface_data
    type: huggingface
  insider:
    cache_duration_minutes: 240
    cache_ttl: 14400
    # Індекси колонок openinsider.com/screener, звірені з реальною сторінкою
    # 2026-07-30. Заголовки: X | Filing Date | Trade Date | Ticker |
    # Company Name | Insider Name | Title | Trade Type | Price | Qty | Owned |
    # ΔOwn | Value | 1d | 1w | 1m | 6m  (усього 17 колонок).
    # Попередня мапа була зсунута на -1: не враховувала службову колонку "X".
    column_mapping:
      filing_date: 1
      trade_date: 2
      ticker: 3
      company_name: 4
      insider_name: 5
      title: 6
      trade_type: 7
      price: 8
      quantity: 9
      owned: 10
      delta_own: 11
      value: 12
    critical: false
    enabled: true
    hash_keys:
    - filing_date
    - ticker
    - insider_name
    table_name: insider_trades
    timeout: 500
    type: insider
    urls:
    - http://openinsider.com/screener?s=&o=&pl=&ph=&ll=&lh=&fd=0&fdr=&td=0&tdr=&fdlyl=&fdlyh=&daysago=&xp=1&xs=1&vl=&vh=&ocl=&och=&sic1=&sicl=&sich=&grp=0&nfl=&nfh=&nil=&nih=&nol=&noh=&v2l=&v2h=&oc2l=&oc2h=&sortcol=0&cnt=100&page=1
    user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  local_file:
    class: LocalFileCollector
    critical: false
    enabled: false
    module: src.data.collectors.local_file_collector
    params:
      date_col: date
      file_path: data/raw/market_data.csv
      file_type: csv
    table_name: local_market_data
    type: local_file
  newsapi:
    api_key_env: NEWS_API_KEY
    base_url: https://newsapi.org/v2/everything
    cache_duration_minutes: 60
    cache_ttl: 86400
    critical: false
    # Enabled 2026-08-16. NEWS_API_KEY has been present in .env all along
    # (32 characters) while the collector sat off, and 2,510 of its articles
    # are already in the database from before it was disabled.
    #
    # The developer tier allows 100 REQUESTS per 24 hours, not 100 articles --
    # an earlier note here said articles and set the wrong expectation. Each
    # request returns up to page_size (20), so the ceiling is ~1,800 articles
    # a day, and the binding constraint is how many distinct queries the day
    # buys. The collector had 552 terms and fired all of them at once with
    # three retries each: 1,656 requests, 1,129 refusals, zero articles.
    #
    # daily_request_budget is the number of requests to spend per UTC day. It
    # sits under the account's 100 so a manual query is not locked out, and it
    # is remembered in budget_state_path across runs -- three runs a day were
    # each starting from zero and re-spending a quota that was already gone.
    daily_request_budget: 90
    budget_state_path: data/state/newsapi_budget.json
    enabled: true
    filter:
      exclude_title_keywords:
      - horoscope
      - celebrity
      min_source_quality: 0.4
    hash_keys:
    - url
    - publishedAt
    language: en
    max_terms: 10
    page_size: 20
    requires_api_key: true
    table_name: newsapi_articles
    timeout: 500
    type: newsapi
  put_call_ratio:
    # Disabled 2026-08-12: CBOE returns HTTP 403 through bot protection, from
    # this project's user agent and from a browser one alike. Their side, and
    # not defeated here. This collector has been repaired twice before (a
    # domain that did not resolve; 59/60 days of fabricated history), so the
    # honest state is off rather than a third attempt. CNN's fear-greed
    # payload carries a put_call_options component if a substitute is wanted
    # — a different series, not a drop-in replacement.
    allow_sample_fallback: false
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: false
    hash_keys:
    - date
    - put_call_ratio
    - sentiment_signal
    table_name: put_call_ratio_data
    type: put_call_ratio
  reddit_sentiment:
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: true
    hash_keys:
    - date
    - subreddit
    - post_id
    subreddits:
    - wallstreetbets
    - stocks
    - investing
    - economics
    table_name: sociological_sentiment_data
    type: reddit_sentiment
    use_synthetic_data: false
  rss:
    cache_duration_minutes: 60
    cache_ttl: 3600
    critical: false
    deduplication:
      max_features: 300
      n_clusters: 10
    enabled: true
    filter:
      exclude_title_keywords:
      - horoscope
      - celebrity
      - sports
      min_source_quality: 0.4
      require_keywords_in_title: false
    hash_keys:
    - link
    headers:
      Accept: application/rss+xml, application/xml, text/xml, */*
      Accept-Language: en-US,en;q=0.9
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
        like Gecko) Chrome/120.0.0.0 Safari/537.36
    params:
      limit_per_feed: 20
      period: 7d
    table_name: rss_news
    timeout: 500
    type: rss
  sec_filings:
    cache_duration_minutes: 240
    cache_ttl: 14400
    critical: false
    enabled: true
    hash_keys:
    - accessionNumber
    - cik
    params:
      period: 60d
    submissions_url_template: https://data.sec.gov/submissions/CIK{cik}.json
    table_name: sec_filings
    type: sec_filings
  vix:
    cache_duration_minutes: 1440
    cache_ttl: 86400
    critical: false
    enabled: true
    # vix_close, not vix_current: the collector has never produced a column by
    # that name (see VixCollector._standardize_columns, which requires
    # vix_close). The wrong name reached DataManager as `unique_on`, so BOTH
    # duplicate protections for this table failed with
    # "Binder Error: Table vix_data does not have a column named vix_current"
    # -- no unique index was ever created and no duplicate check ever ran.
    # Confirmed against the DB: vix_data has 0 indexes.
    # Identity only. `volatility_regime` is DERIVED from a moving average,
    # so it flipped between collections of the same trading day and each
    # flip stored a second row: 22 of 77 dates were duplicated. A key that
    # includes content is not an identity, it is a change detector -- the
    # same defect that put 273 duplicate bars in market_data_raw.
    hash_keys:
    - date
    params:
      interval: 1d
      period: 30d
    table_name: vix_data
    ticker: ^VIX
    type: vix
  yahoo_finance:
    cache_duration_minutes: 15
    cache_ttl: 900
    critical: true
    # `daily_max_years: 2` lived here until 2026-08-17 with ZERO readers in the
    # code -- a dead key that read like the live limit and cost an afternoon.
    # The real setting is timeframes.1d.period below. Removed rather than wired,
    # because two places declaring one number is how every fix in this project
    # has half-landed.
    enabled: true
    intraday_max_days: 60
    max_retries: 3
    retry_delay: 5
    table_name: market_data_raw
    timeframes:
      15m:
        period: 60d
      1d:
        # Was 2y, and that two years was the binding constraint on the whole
        # project without anyone choosing it.
        #
        # Measured 2026-08-17: every timeframe held two years or less, so the
        # data contained roughly ONE bad market episode and one good one. Any
        # "when not to trade" rule fitted on that is fitting the boundary
        # between two periods rather than a repeatable relationship -- which is
        # exactly what happened to a bar-amplitude filter that looked
        # significant (t=-3.42) and then behaved in perfect reverse across the
        # two slices.
        #
        # Yahoo serves far more, and it is free: AAPL from 1980 (11,511 bars),
        # SPY from 1993, XOM and KO from 1962. Only the intraday intervals have
        # a real provider ceiling (60d and 730d, enforced in
        # yf_collector._INTRADAY_HISTORY_LIMIT_DAYS).
        #
        # 30 years rather than everything available: it reaches back to 1996 and
        # covers the dot-com bust, 2008, 2011, 2015, 2018, 2020 and 2022 -- call
        # it seven stress episodes against the one we had -- without reaching
        # into an era whose market structure (fractional pricing before 2001,
        # no ETFs, different session rules) makes a breakout mean something
        # else. Tickers younger than that simply return what exists.
        #
        # The same reasoning that freed the hourly window applies here: price
        # history may outrun news history, because the availability flags now
        # mean "a reading at THIS row" and news_coverage marks the collected
        # era. A bar from 1998 will correctly carry no news rather than a zero
        # that reads as "nothing happened".
        period: 30y
      1h:
        # Was 180d, bounded by NEWS coverage rather than by Yahoo. That bound
        # is lifted, and the reason it existed is worth keeping:
        #
        # Our news history starts 2026-03-14. Asking for 730 days adds ~17
        # months of bars whose 144 news/sentiment features are zero -- and
        # nothing in the frame distinguished "no news happened" from "no news
        # collected", so those zeros would have taught the models that the
        # past was newsless. The old comment cited sentiment_available_* being
        # the constant 1.0 as proof of that gap.
        #
        # Two things changed. The availability flags now mean what they say
        # (measured: sentiment_available 0.204 on daily, 0.837 on hourly,
        # 1.000 on 15m where the news genuinely covers every bar), and
        # NewsQualityEnricher emits `news_coverage` -- 1 where the bar falls
        # inside the collected news window, computed from the earliest story
        # held. A zero before coverage is now labelled as such.
        #
        # So price history may outrun news history: the frame says which era
        # each bar belongs to. 730 is the documented Yahoo ceiling; 728 leaves
        # room for the request window to drift by a day.
        #
        # Expect ~4x the hourly rows (46,433 over 183 days -> ~185,000) and a
        # correspondingly longer Stage 3.
        period: 728d
    timeout: 30
    type: yahoo_finance
    benchmark_tickers:
      - XLK
      - XLE
      - XLV
      - XLF
      - XHB
      - MOO
  wikimedia_attention:
    enabled: true
    frequency: daily
    table_name: wikipedia_attention_data
    days_back: 30
    project: en.wikipedia
    type: wikimedia_attention
  sdmx_macro:
    enabled: true
    frequency: daily
    table_name: macro_sdmx_data
    agencies:
      # WB_WDI, not WB: у sdmx1 джерело "WB" — це World Bank WITS, у якого є
      # лише торгові/тарифні dataflow'и (DF_WITS_*), жодного CPI/GDP.
      - WB_WDI
      # ECB / IMF / OECD / BIS свідомо вимкнені, а не забуті: їхні індикатори
      # нижче задані БЕЗ ключа (напр. ECB "ICP"), тобто це запит на весь
      # dataflow по всіх країнах і серіях. Перевірено: ECB ICP не повернувся
      # за 8+ хвилин. Щоб їх увімкнути, спершу треба задати конкретний ключ
      # (як зроблено для WB_WDI: FREQ.SERIES.REF_AREA), інакше один такий
      # запит блокує всю стадію збору. request_timeout нижче — страховка.
      # - ECB
      # - IMF
      # - OECD
      # - BIS
    request_timeout: 90
    indicators:
      # SDMX-коди WDI пишуться з підкресленнями, а не з точками, як у
      # звичайному REST API World Bank: FP_CPI_TOTL_ZG, не FP.CPI.TOTL.ZG.
      WB_WDI:
        - FP_CPI_TOTL_ZG      # інфляція, CPI, % річних
        - NY_GDP_MKTP_KD_ZG   # зростання реального GDP, %
      ECB:
        - ICP
      IMF:
        - CPI
        - GDP
      OECD:
        - MEI
      BIS:
        - WS_CBPOL_D
    # Країни для джерел, у яких dataflow має вимір REF_AREA (WB_WDI).
    ref_areas:
      - USA
      - CHN
      - EMU
      - JPN
      - DEU
      - GBR
    type: sdmx_macro
