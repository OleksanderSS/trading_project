assets:
  presets:
    default_volatile:
      description: A comprehensive and diversified set of volatile tickers from key
        sectors, as per user specification.
      sectors: [ai_big_tech, semiconductors, market_etfs, consumer_staples, energy,
        finance]
      # The four XL* sector ETFs were added 2026-08-06. They were already
      # being modelled -- every export up to that date carried 22 tickers,
      # these four among them -- because they arrive as the Yahoo
      # collector's `benchmark_tickers` and nothing then narrowed the set.
      # Now that active_preset actually governs, a preset listing only 18
      # would silently drop them. This list is the modelling scope, so it
      # states all of it.
      tickers: [TSLA, NVDA, SPY, QQQ, AMD, KO, WMT, XOM, JPM, GS, AAPL, MSFT, GOOGL,
        AMZN, INTC, TSM, IWM, BAC, XLE, XLF, XLK, XLV]
  # Set to null on 2026-08-24 to model all 110 tickers in `sectors`
  # instead of the 22 in `default_volatile`.
  #
  # The reason is that at 22 names nothing measures. The rank portfolio
  # over the whole batch gave t = 0.85, the best non-price feature t =
  # 0.29, and a 20-day target leaves eight non-overlapping periods in
  # eight years. Three independent routes all ended at the same wall,
  # and it is breadth, not the model.
  #
  # What made this affordable is that the batch peak of 2.70 GiB was
  # broken down: 0.39 is imports, up to 2.0 is DuckDB's buffer pool,
  # and only about 0.5 scales with the number of tickers. Five times
  # the names is therefore roughly 5 GiB, not 13.5.
  #
  # Cost is time rather than memory: enrichment is 93.8% of stage 3 and
  # grows with rows, so expect roughly ten hours where 22 took 2.2.
  active_preset: null
  sectors:
    ai_big_tech:
      description: Large-cap technology stocks with a strong focus on AI.
      assets: [AAPL, MSFT, GOOGL, AMZN, NVDA, TSLA]
    semiconductors:
      description: Companies involved in the semiconductor industry.
      assets: [NVDA, AMD, INTC, TSM]
    market_etfs:
      description: Major market index ETFs.
      assets: [SPY, QQQ, IWM]
    finance:
      description: Major financial institutions.
      assets: [JPM, BAC, GS]
    consumer_staples:
      description: Large-cap consumer staple companies.
      assets: [KO, WMT]
    energy:
      description: Major integrated oil and gas companies.
      assets: [XOM]
    core:
      description: Auto-imported category core
      assets: [SPY, QQQ, IWM, DIA, AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA, JPM,
        BAC, WFC, GS, JNJ, PFE, UNH, ABBV, PG, KO, HD, MCD, WMT, COST, XOM, CVX, COP,
        CAT, DE, BA, GE]
    etf:
      description: Auto-imported category etf
      assets: [SPY, QQQ, DIA, IWM, VTI, GLD, SLV, TLT, XLF, XLE, XLI, XLU, XLK, XLV,
        XME]
    tech_giants:
      description: Auto-imported category tech_giants
      assets: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA]
    additional_tech:
      description: Auto-imported category additional_tech
      assets: [AMD, INTC, CSCO, IBM, ORCL, CRM, ADBE, NFLX]
    healthcare:
      description: Auto-imported category healthcare
      assets: [JNJ, PFE, UNH, ABT, MRK, LLY, BMY, AMGN, GILD]
    consumer:
      description: Auto-imported category consumer
      assets: [PG, KO, PEP, WMT, HD, MCD, NKE, SBUX]
    industrial:
      description: Auto-imported category industrial
      assets: [GE, MMM, HON, CAT, DE, UPS, RTX, BA]
    materials:
      description: Auto-imported category materials
      assets: [DD, DOW, LIN, ECL, APD, NEM, FCX, BHP]
    utilities:
      description: Auto-imported category utilities
      assets: [NEE, DUK, SO, AEP, EXC, SRE, ED, PEG]
    realestate:
      description: Auto-imported category realestate
      assets: [AMT, PLD, EQIX, PSA, CBRE, WELL, VTR, AVB]
    communication:
      description: Auto-imported category communication
      assets: [VZ, T, TMUS, CMCSA, CHTR, DIS, FOXA]
    international:
      description: Auto-imported category international
      assets: [BABA, BIDU, JD, PDD, NIO, XPEV, LI, BILI]
    crypto:
      description: Auto-imported category crypto
      # SQ and BLOCK removed 2026-08-05: neither resolves on Yahoo any more
      # ("possibly delisted; no timezone found"). Both were Block Inc. --
      # SQ the original symbol, BLOCK a later one -- and each cost three
      # retry rounds per interval on every collection run before failing.
      #
      # Until 7395f88c a failure here discarded every OTHER ticker's data
      # for that whole interval, so these two silently cost the pipeline
      # five days of collection.
      #
      # Block Inc.'s current symbol is NOT added back automatically: adding
      # a ticker changes what the whole pipeline collects and models, which
      # is a decision rather than a repair.
      assets: [COIN, MARA, RIOT, PYPL, GBTC, EBAY]
  # ------------------------------------------------------------------
  # SECTOR PARTITION — the membership the sector CONTEXT LAYER uses.
  # ------------------------------------------------------------------
  #
  # Separate from `sectors` above, which cannot serve this purpose: it is
  # two taxonomies merged. Six hand-written entries (ai_big_tech,
  # semiconductors, market_etfs, finance, consumer_staples, energy) are
  # SUBSETS of thirteen later auto-imported ones, and `core` (32 names) is
  # not a sector at all but "large caps", overlapping everything.
  #
  # Measured 2026-09-02: 29 of 110 tickers sit in more than one entry, and
  # `ai_big_tech` vs `tech_giants` share six names of 6/7 -- their daily
  # equal-weight returns correlate at 0.986 (REGISTER #225). A sector
  # layer built on that would present one series twice and count it as two
  # sectors, adding multiplicity without information.
  #
  # This block is a genuine PARTITION: every one of the 110 tickers appears
  # exactly once. `sectors` above is left untouched because it is what the
  # collector reads to decide what to download; changing it would change
  # the universe, which is a different decision.
  #
  # Enforced by tests/contracts/test_sector_partition_is_a_partition.py.
  sector_partition:
    tech_giants:
      assets: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA]
    additional_tech:
      assets: [AMD, INTC, CSCO, IBM, ORCL, CRM, ADBE, NFLX, TSM]
    healthcare:
      assets: [JNJ, PFE, UNH, ABT, MRK, LLY, BMY, AMGN, GILD, ABBV]
    consumer:
      assets: [PG, KO, PEP, WMT, HD, MCD, NKE, SBUX, COST]
    industrial:
      assets: [GE, MMM, HON, CAT, DE, UPS, RTX, BA]
    materials:
      assets: [DD, DOW, LIN, ECL, APD, NEM, FCX, BHP]
    utilities:
      assets: [NEE, DUK, SO, AEP, EXC, SRE, ED, PEG]
    realestate:
      assets: [AMT, PLD, EQIX, PSA, CBRE, WELL, VTR, AVB]
    communication:
      assets: [VZ, T, TMUS, CMCSA, CHTR, DIS, FOXA]
    international:
      assets: [BABA, BIDU, JD, PDD, NIO, XPEV, LI, BILI]
    crypto:
      assets: [COIN, MARA, RIOT, PYPL, GBTC, EBAY]
    finance:
      assets: [JPM, BAC, GS, WFC]
    energy:
      assets: [XOM, CVX, COP]
    etf:
      assets: [SPY, QQQ, DIA, IWM, VTI, GLD, SLV, TLT, XLF, XLE, XLI, XLU, XLK, XLV, XME]

  details:
    TSLA: {cik: 1318605}
    NVDA: {cik: 1045810}
    # Was 896976 until 2026-08-21. That number resolves -- HTTP 200 -- to
    # 'VAN KAMPEN AMERICAN CAPITAL EQUITY OPPORTUNITY TRUST SER 14', an
    # unrelated entity whose 24 filings all fall between 1995 and 2001.
    # Nothing landed inside the collection window, so the collector reported
    # no error and SPY contributed zero filings on every run since. A CIK that
    # resolves is not a CIK that is right.
    # 884394 is 'SPDR S&P 500 ETF TRUST' per SEC's own ticker map, 274
    # filings, latest 2026-05-29.
    SPY: {cik: 884394}
    QQQ: {cik: 1067839}
    AMD: {cik: 2488}
    KO: {cik: 21344}
    WMT: {cik: 104169}
    # 34088 is 'EXXON MOBIL CORP', 1000 filings, latest 2026-08-07 -- correct
    # and still filing. Noted 2026-08-21: SEC's ticker map now points XOM at
    # 2115436, 'ExxonMobil Holdings Corp', 28 filings since 2026-07-01. If
    # filings under 34088 stop, the holdco is where they moved. Not switched
    # now: it would drop the history and this one still files.
    XOM: {cik: 34088}
    JPM: {cik: 19617}
    GS: {cik: 886982}
    AAPL: {cik: 320193}
    MSFT: {cik: 789019}
    GOOGL: {cik: 1652044}
    AMZN: {cik: 1018724}
    INTC: {cik: 50863}
    TSM: {cik: 1046179}
    # IWM has no CIK entry here on purpose. 1112953 returned 404 on every
    # run, and IWM is absent from https://www.sec.gov/files/company_tickers.json
    # entirely: the iShares Russell 2000 ETF is a series of a trust rather
    # than its own filer, so there is no per-ticker submissions file to fetch.
    # A wrong number that errors every run is worse than no number.
    BAC: {cik: 70858}

    # The 83 entries below were resolved against SEC's own ticker map,
    # https://www.sec.gov/files/company_tickers.json, on 2026-08-24 --
    # the same source the comments above cite when a hand-entered number
    # turned out to name the wrong company. None was typed by hand.
    #
    # They exist because the modelling universe is widening from the
    # 22-ticker preset to all 110 tickers in `sectors`, and 93 of those
    # 110 had no CIK. Without one the XBRL collector fetches nothing, so
    # a wide run would have carried fundamentals on the old names only --
    # and fundamentals are where the strongest non-price timing signal
    # measured so far lives (fund_debt_to_equity, +0.0388 IC, 5.3 SE).
    #
    # Ten tickers are still absent, deliberately: IWM, TLT, VTI, XLE, XLF,
    # XLI, XLK, XLU, XLV, XME. Each is an ETF that files as a series of a
    # trust rather than as its own filer, so SEC's map has no entry -- the
    # same reason already written above for IWM.
    #
    # XOM stays 34088 against the map's 2115436. That disagreement is
    # already reasoned about above and the decision there stands.
