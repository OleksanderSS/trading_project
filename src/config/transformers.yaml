
transformers:
  # - StandardScaler: Scales features to have a mean of 0 and a standard deviation of 1.
  #   Best for algorithms that assume a Gaussian distribution.
  - module: "src.feature_engineering.transformers.transformers.StandardScalerTransformer"
    class: "StandardScalerTransformer"
    params:
      columns: [
        "macd", "rsi", "bollinger_mavg", "atr", "obv", 
        "sentiment_score", "news_volume", "volatility", "spread"
      ]

  # - MinMaxScaler: Scales features to a given range, typically [0, 1].
  #   Useful for neural networks and algorithms sensitive to feature magnitudes.
  - module: "src.feature_engineering.transformers.transformers.MinMaxScalerTransformer"
    class: "MinMaxScalerTransformer"
    params:
      columns: [] # Specify columns here if needed, or leave empty if unused
