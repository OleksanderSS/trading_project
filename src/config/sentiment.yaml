
sentiment:
  active_model: "finbert"
  analyzers:
    finbert:
      enabled: true
      source: "huggingface"
      model_name: "ProsusAI/finbert"
      device: "auto"
      confidence_threshold: 0.85
    roberta:
      enabled: true
      source: "huggingface"
      model_name: "cardiffnlp/twitter-roberta-base-sentiment"
      device: "auto"
      confidence_threshold: 0.80
      max_length: 128
      batch_size: 16
    simple:
      enabled: true
      positive_words: ["good", "great", "excellent", "positive", "bullish", "buy", "strong", "growth", "profit", "gain", "up", "rise", "increase", "win", "success", "breakthrough", "innovation", "record", "high", "best", "top", "leader", "outperform", "beat", "rally", "surge"]
      negative_words: ["bad", "terrible", "negative", "bearish", "sell", "weak", "loss", "decline", "fall", "decrease", "drop", "crash", "risk", "threat", "concern", "worry", "fear", "panic", "crisis", "recession", "low", "worst", "fail", "struggle", "problem", "issue", "challenge", "miss", "underperform", "plunge", "slump"]
