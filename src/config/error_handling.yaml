
# Configuration for the EnhancedErrorAnalyzer

# Default adaptive weights for different feature groups
adaptive_weights:
  macro: 1.0
  sentiment: 1.0
  technical: 1.0
  price: 1.0
  volume: 1.0
  calendar: 1.0

# Adaptive thresholds for classifying error magnitudes
adaptive_thresholds:
  error_magnitude:
    low: 0.1
    medium: 0.5
    high: 1.0
    critical: 2.0
  relative_error:
    low: 0.05
    medium: 0.2
    high: 0.5
    critical: 1.0
  feature_contribution:
    low: 0.1
    medium: 0.3
    high: 0.6
    critical: 0.9

# Weights for different feature types in contribution analysis
feature_weights:
  macro: 1.2
  sentiment: 1.1
  technical: 1.0
  price: 1.3
  volume: 1.0
  calendar: 0.8

# Thresholds for identifying strong macro events
macro_thresholds:
  vix: 0.7
  cpi: 0.5
  fed: 0.6
  unrate: 0.5
  gdp: 0.4
  inflation: 0.5

# Thresholds for identifying extreme technical indicator values
technical_thresholds:
  rsi: 2.0
  macd: 1.5
  gap: 0.1
  bollinger: 2.0
  stochastic: 0.8

# Configuration for the EnhancedTriggerLayer
trigger_layer:
  spike_threshold: 10
  sentiment_threshold: 0.8
  repetition_threshold: 3
  volume_threshold: 2.0
  price_gap_threshold: 0.05
  news_cluster_window: "1H"
  news_cluster_threshold: 5
  enable_adaptive: true
  max_history: 1000
  keyword_config: {}
