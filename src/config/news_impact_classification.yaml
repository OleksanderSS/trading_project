# News Impact Classification Configuration (Unified Multi-Tagging Architecture)
# Уніфікований реєстр подій для Modular Analyst Pipeline

news_impact_classification:
  
  market_wide:
    keywords: [etf, index, nasdaq, s&p 500, earnings, earnings report, quarterly results, financial results, merger, m&a, acquisition, lawsuit, regulation, downgrade, upgrade, buyback, dividend, guidance, forecast, ipo, bankruptcy, restructuring]
    impact_type: "market_wide"
    affected_tickers: "all"
    affected_tags: ["market_wide"]
    timeframes: ["1d", "60m"]
    impact_strength: "high"
    description: "Загальноринкові події"

  finance_economy:
    keywords: [inflation, interest rates, federal reserve, gdp, unemployment, recession, stimulus, bond yields, market, economy, economic, financial, stocks, trading, investors, analysis, forecast, outlook, report]
    impact_type: "macro_economic"
    affected_tickers: "all"
    affected_tags: ["macro_economic", "finance"]
    timeframes: ["1d"]
    impact_strength: "high"
    description: "Макроекономіка та Фінанси"

  sectors_tech:
    keywords: [ai, ev, semiconductor, chips, cloud, tech, quantum computing, cybersecurity, data breach, robotics, automation, battery, charging]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["semiconductors", "ai_infrastructure", "hardware", "software"]
    timeframes: ["15m", "60m", "1d"]
    impact_strength: "high"
    description: "Технології, ШІ та Напівпровідники"

  healthcare_biotech:
    keywords: [fda approval, clinical trial, biotech, pharmaceutical, medical device]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["healthcare", "biotech", "medical_devices"]
    timeframes: ["1d"]
    impact_strength: "high"
    description: "Медицина та Біотехнології"

  financial_services:
    keywords: [banking, insurance, fintech, payments, lending]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["banking", "fintech", "insurance"]
    timeframes: ["60m", "1d"]
    impact_strength: "medium"
    description: "Фінансові послуги"

  energy_commodities:
    keywords: [oil, crude, brent, energy, commodities, opec, gas, renewables]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["energy", "oil_gas", "renewables", "commodities"]
    timeframes: ["1d"]
    impact_strength: "medium"
    description: "Енергетика та Сировина"

  industrial_logistics:
    keywords: [logistics, supply chain, shipping, freight, maritime, container, transport, rail, aviation, trucking, port, inventory]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["logistics", "supply_chain", "transportation"]
    timeframes: ["1d"]
    impact_strength: "medium"
    description: "Промисловість та Логістика"

  metals_mining:
    keywords: [metallurgy, mining, steel, aluminum, copper, lithium, rare earth, ore, refining, smelter, iron]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["metals", "mining", "raw_materials"]
    timeframes: ["1d"]
    impact_strength: "medium"
    description: "Металургія та Видобуток"

  consumer_retail:
    keywords: [retail, consumer spending, fmcg, e-commerce, discretionary, staples, supermarket, luxury]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["retail", "consumer_goods", "e_commerce"]
    timeframes: ["60m", "1d"]
    impact_strength: "low"
    description: "Споживчий сектор та Ритейл"

  real_estate_construction:
    keywords: [real estate, reit, housing, construction, commercial property, mortgage, building materials]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["real_estate", "construction"]
    timeframes: ["1d"]
    impact_strength: "low"
    description: "Нерухомість та Будівництво"

  agriculture_food:
    keywords: [agriculture, farming, fertilizer, crop, grain, wheat, food supply, livestock]
    impact_type: "sector_specific"
    affected_tickers: "dynamic"
    affected_tags: ["agriculture", "food_supply"]
    timeframes: ["1d"]
    impact_strength: "low"
    description: "Сільське господарство та Їжа"

  geopolitics:
    keywords: [sanctions, tariffs, trade war, conflict, china, eu, us fed, antitrust]
    impact_type: "geopolitical"
    affected_tickers: "all"
    affected_tags: ["geopolitics", "global_trade"]
    timeframes: ["1d", "60m"]
    impact_strength: "high"
    description: "Геополітика та Регуляція"

# ============================================
# IMPACT STRENGTH MAPPING
# ============================================
impact_strength_mapping:
  high: 
    multiplier: 1.0
    priority: "immediate"
    retention_hours: 48
    
  medium:
    multiplier: 0.7
    priority: "normal"
    retention_hours: 24
    
  low:
    multiplier: 0.5
    priority: "low"
    retention_hours: 12

# ============================================
# TIMEFRAME IMPACT PATTERNS
# ============================================
timeframe_impact_patterns:
  intraday: ["15m"]
  swing: ["60m"]
  position: ["1d"]
