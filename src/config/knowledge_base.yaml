news:
  field_mappings:
    published_at: ["published", "pubDate", "date", "created", "created_utc", "timestamp", "time", "published_at", "publishedAt"]
    headline: ["title", "headline"]
    summary: ["content", "summary", "description", "body", "text", "message", "snippet"]
    source_url: ["url", "link"]
    source_name: ["source"]
  text_analytics_defaults:
    max_features_per_source: 1000
    ngram_range: [1, 2]
    n_clusters: 10
    stop_words: ["a", "the", "in", "is", "are", "to", "for", "of"]
