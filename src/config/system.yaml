system:
  # Logging. setup_logging() used to default to DEBUG and no caller ever
  # passed a level, so the whole project ran at DEBUG: 42.9% of the lines in
  # logs/system.log were DEBUG while the file rotates at 10 MB x 5 backups,
  # so half the retained history was noise and real ERROR/CRITICAL lines were
  # buried in it. Set this to DEBUG while tracing something specific.
  log_level: INFO
  # Read by ProjectLogger._get_config_path; this key did not exist either, so
  # the lookup always fell through to its 'logs' default.
  logs_path: logs

  storage:
    db_path: data/test_main.duckdb
  
  accumulation:
    output_dir: data/colab/accumulated
  
  google_drive:
    enabled: false
    folder_id: null
  
  # ✅ Fallback storage options
  storage_fallback:
    s3:
      enabled: false
      access_key: null
      secret_key: null
      region: us-east-1
      bucket: null
    gcs:
      enabled: false
      project_id: null
      bucket: null

# ---------------------------------------------------------------------------
# Outbound HTTP: retries, timeouts and rate limiting for every external API.
#
# This section did not exist. HttpClientFactory read `http_client` and got {},
# so every value below was a hardcoded default and none of it was tunable.
# The default rate limit was 100 requests per second, per factory instance,
# and up to five instances were created in a single pipeline run.
# ---------------------------------------------------------------------------
http_client:
  timeout: 20.0
  user_agent: "TradingBot/2.0 (Unified Ecosystem)"

  # Retried by the send wrapper in HttpClientFactory, NOT by httpx: httpx's
  # own `retries` covers connection establishment only.
  retries: 3
  backoff_factor: 0.5
  status_forcelist: [429, 500, 502, 503, 504]

  rate_limiter:
    # Applies to any host without a specific entry below.
    rate_limit: 10
    per_seconds: 1.0

    # Matched as a substring of the request hostname, first match wins.
    # Limits are set from each source's published policy where one exists,
    # and conservatively where it does not.
    per_host:
      reddit.com:          # returned 429 during collection runs
        rate_limit: 1
        per_seconds: 2.0
      newsapi.org:         # free tier is quota-based, not rate-based
        rate_limit: 2
        per_seconds: 1.0
      stlouisfed.org:      # FRED: 120 req/min published
        rate_limit: 2
        per_seconds: 1.0
      cftc.gov:
        rate_limit: 2
        per_seconds: 1.0
      wikimedia.org:       # 200 req/s allowed, but be a good citizen
        rate_limit: 10
        per_seconds: 1.0
      cboe.com:            # blocks us at the source (403); do not hammer
        rate_limit: 1
        per_seconds: 5.0
      aaii.com:            # blocks us at the source (403)
        rate_limit: 1
        per_seconds: 5.0

# ---------------------------------------------------------------------------
# Notifications. This section did not exist either, so UniversalNotifier fell
# back to ['log'] and the Telegram/Discord code could never run.
#
# CREDENTIALS ARE NOT SET HERE. They are read from the environment
# (TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL), loaded from
# .env by SecureSecretsManager -- the same way every collector reads its API
# key. Config files are committed to git; tokens must not be.
#
# To enable Telegram: put the two variables in .env, then add 'telegram' to
# enabled_backends below.
# ---------------------------------------------------------------------------
notifications:
  enabled_backends:
    - log
  # Minimum severity ErrorHandler will notify about (it already applies a
  # per-error cooldown before sending).
  notify_from_severity: error
