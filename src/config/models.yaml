
# Dummy section to satisfy the configuration validator
model:
  is_present: true

# Real configuration used by the ModelFactory
models:
  model_definitions:
    catboost: { module: "src.models.tree.catboost_model", class: "CatBoostModel" }
    lightgbm: { module: "src.models.tree.lightgbm_model", class: "LightGBMModel" }
    xgboost: { module: "src.models.tree.xgboost_model", class: "XGBoostModel" }
    random_forest: { module: "src.models.tree.random_forest_model", class: "RandomForestModel" }
    linear: { module: "src.models.linear.linear_model", class: "LinearModel" }
    svm: { module: "src.models.linear.svm_model", class: "SVMModel" }
    knn: { module: "src.models.linear.knn_model", class: "KNNModel" }
    mlp: { module: "src.models.neural.mlp_model", class: "MLPModel" }
    cnn: { module: "src.models.neural.cnn_model", class: "CNNModel" }
    lstm: { module: "src.models.neural.lstm_model", class: "LSTMModel" }
    gru: { module: "src.models.neural.gru_model", class: "GRUModel" }
    transformer: { module: "src.models.neural.transformer_model", class: "TransformerModel" }
    tabnet: { module: "src.models.neural.tabnet_model", class: "TabNetModel" }
    autoencoder: { module: "src.models.neural.autoencoder_model", class: "AutoencoderModel" }
    ensemble: { module: "src.models.ensemble.ensemble_model", class: "EnsembleModel" }

  dual_model_manager:
    base_path: "data/models"
    light_models: ["lightgbm", "random_forest", "linear", "mlp", "ensemble", "catboost", "xgboost", "knn", "svm"]
    heavy_models: ["gru", "tabnet", "transformer", "cnn", "lstm", "autoencoder", "mlp", "neural_network", "base_neural"]

  trained_models_registry:
    BTC_LSTM_v2: "data/trained_models/BTC_LSTM_v2.joblib"
    consensus_meta_model: "data/trained_models/consensus_meta_model.pkl"

  # The hybrid split. `light` is trained locally by UnifiedTrainingManager;
  # `heavy` is trained in Colab, where scripts/colab/colab_clean_cell.py
  # builds each one directly (sklearn MLPRegressor, tf.keras.Sequential,
  # pytorch_tabnet). Since 2026-08-02 the local ModelFactory has no class for
  # the heavy names and says so explicitly if asked for one -- so this list
  # documents what goes to Colab, it does not enable anything locally.
  #
  # `heavy` and colab_clean_cell.py's own heavy_models list are two
  # hand-maintained copies of one thing. They currently agree; if they ever
  # diverge, this file is the intended source.
  categories:
    light: ["catboost", "lightgbm", "xgboost", "random_forest", "linear", "svm", "knn"]
    heavy: ["mlp", "cnn", "lstm", "gru", "transformer", "tabnet", "autoencoder"]

  # Feature budget per model. THE source of this number: read through
  # src/config/feature_budget.get_model_max_features, which both the local
  # trainer and the Colab trainer now call.
  #
  # These values did nothing until 2026-08-11. They were handed to the model
  # CONSTRUCTOR as a hyperparameter, never used to limit feature selection,
  # while a hardcoded map inside the Colab script decided the real numbers
  # (cnn 64, lstm/gru/transformer/autoencoder 128, mlp/tabnet 256) and the
  # light branch was not capped at all — median 388 features, max 1,145.
  #
  # Why 35 everywhere, and why the old split was backwards: the binding
  # constraint is observations per feature, not model complexity. Measured on
  # the current batch, a daily context has ~308 training rows, 60m ~505, 15m
  # ~656. At 35 features that is 9 / 14 / 19 observations each — thin but
  # falsifiable. At the old 100-115 for heavy models it is 3 to 6, which
  # cannot distinguish an edge from a coincidence. Neural nets need MORE
  # observations per parameter than trees, so giving them the larger budget
  # was the wrong way round.
  #
  # 35 was a measurement setting, and on 2026-08-12 it got measured. Holdout
  # R2 on target_return_1d across 22 daily contexts (median / share of
  # contexts above zero), sweeping the budget with everything else held
  # fixed — same split, same scaler, same correlation ranking:
  #
  #     model            k=5              k=12             k=35
  #     linear          -0.052  15.9%    -0.062  13.6%    -0.087   6.8%
  #     catboost        -0.051  18.2%    -0.043  22.7%    -0.028  18.2%
  #     lightgbm        -0.150   6.8%    -0.204   6.8%    -0.254   2.3%
  #     random_forest   -0.199   6.8%    -0.147   9.1%    -0.126   6.8%
  #     knn             -0.198   9.1%    -0.165   0.0%    -0.186  18.2%
  #     svm             -0.209   0.0%    -0.240   4.5%    -0.276   0.0%
  #     xgboost         -0.317   0.0%    -0.348   4.5%    -0.336   4.5%
  #
  # (For linear a finer sweep put the median best at k=3, -0.036, with k=5
  # holding the better share above zero. Baseline — predict the training
  # mean — scores -0.01 on the same holdouts.)
  #
  # The direction is NOT the same for every model, which is why one number
  # for all of them was wrong. Linear, lightgbm, svm and xgboost degrade as
  # features are added; catboost and random_forest improve, because both
  # subsample features per split and do their own selection. Handing all
  # seven the same 35 penalised four of them.
  #
  # Scope, stated so it is not over-read: one regression target, daily
  # contexts, ~368 training rows. It does not measure classification, where
  # 51 of the 65 surviving champions live, nor the heavy models below, which
  # were archived before this ran. Those keep 35 until someone measures them.
  per_model:
    catboost:
      max_features: 35     # best at 35; improves with more
    lightgbm:
      max_features: 5      # -0.150 at 5 vs -0.254 at 35
    xgboost:
      max_features: 5      # worst model measured at any budget; see above
    random_forest:
      max_features: 35     # best at 35; improves with more
    linear:
      max_features: 5      # -0.052 at 5 vs -0.087 at 35, and -7.35 before RidgeCV
    svm:
      max_features: 5      # -0.209 at 5 vs -0.276 at 35
    knn:
      max_features: 12     # distance-based; degrades in high dimension
    mlp:
      max_features: 35
    cnn:
      max_features: 35
    lstm:
      max_features: 35
    gru:
      max_features: 35
    transformer:
      max_features: 35
    tabnet:
      max_features: 35
    autoencoder:
      max_features: 35

  sentiment:
    model_name: "yiyanghkust/finbert-tone"

# ---------------------------------------------------------------------------
# Model promotion gate (Stage 4 -> CHAMP_ files that Stage 5 loads).
#
# Writing CHAMP_ used to be an unconditional copy of whichever candidate
# scored highest on the selection split. A model that loses to predicting the
# training mean still became the champion the prediction stage would load.
#
# The gate requires the winner to have been measured on the purged holdout
# (a split nothing in model selection reads) and to beat a train-only naive
# baseline there -- majority class for classification, train mean for
# regression.
#
# A failed gate WITHHOLDS a promotion; it does not delete the incumbent, so
# an existing champion keeps answering and predictions do not go to zero.
# Set enabled: false to restore the old unconditional behaviour.
# ---------------------------------------------------------------------------
training:
  promotion_gate:
    enabled: true
    # Below this many holdout rows the measurement is not worth acting on.
    min_holdout_rows: 20
    # How far above the naive baseline the winner must score. 0.0 means
    # "strictly better"; raise it to demand a real margin.
    min_baseline_margin: 0.0
    # The opponent an investor actually has: owning the same exposure and
    # doing nothing. The constant and persistence baselines are both about the
    # SHAPE of the series and cannot see this.
    #
    # Measured 2026-08-20 on 11 walk-forward folds over 30 years of daily
    # data. Without this column an arm scoring positive in ELEVEN OF ELEVEN
    # folds read as a success; beside it, the same arm was earning the market
    # and adding +0.00021 of its own, t=0.55. The arm trained on a
    # cross-sectional target added +0.00132, t=2.78.
    #
    # Only binds where the comparison is measurable: a regression target whose
    # values look like returns. Classification targets carry no payoff and
    # report `not_applicable` rather than a fabricated zero.
    require_excess_over_passive: true
    min_excess_over_passive: 0.0
    # Refuse to promote any fit with at least as many features as training
    # rows. Measured on the 2026-08-06 batch, EVERY context is in that state
    # (AAPL 1d 327 features / ~196 train rows; SPY 60m 605 / ~151; AAPL 15m
    # 870 / ~390), so turning this on stops the light branch producing new
    # champions until train-only feature selection cuts the count to the
    # 20-40 range. Left off by default because the holdout-versus-baseline
    # test above is the empirical check for overfitting; the ratio is a
    # heuristic, and it is recorded as a warning either way.
    block_when_features_exceed_rows: false
