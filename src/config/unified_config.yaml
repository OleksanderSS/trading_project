      nlp_features: {enabled: true}
      sentiment_features: {enabled: true}
      decay_features: {enabled: true}
      significance_features: {enabled: true}
      technical_analysis: {enabled: true}
      time_features: {enabled: true}
      context_map: {enabled: true}

# ---------------------------------
# Analysis Section
# ---------------------------------
analysis:
  # Configuration for the UnifiedAnalyticsEngine
  engine:
    max_workers: 8
    analyzers:
      - name: "critical_signal_detector"
        module: "src.analytics.detectors.critical_signal_detector" # UPDATED PATH
        class: "CriticalSignalDetector"
        data_mapping:
          - "price_data"
      - name: "macro_context_analyzer"
        module: "src.analytics.context.macro_context_analyzer" # PATH VERIFIED
        class: "MacroContextAnalyzer"
        data_mapping:
          - "economic_data"
          - "historical_economic_data"
      - name: "news_impact_analyzer"
        module: "src.analytics.analyzers.news_impact_analyzer" # PATH VERIFIED
        class: "NewsImpactAnalyzer"
        data_mapping:
          - "news_data"
          - "price_data"
      - name: "market_context_analyzer"
        module: "src.analytics.context.market_context_analyzer"
        class: "MarketContextAnalyzer"
        params:
          context_features:
            - "volatility_5d"
            - "volatility_20d"
            - "volatility_ratio"
            - "trend_5d"
            - "trend_20d"
            - "trend_alignment"
            - "rsi_current"
            - "volume_ratio"
            - "price_to_ma20"
            - "hour_of_day"
            - "day_of_week"
            # ✅ НОВІ КОНТЕКСТНІ ПОКАЗНИКИ (з CONTEXT_FEATURES_RECOMMENDATIONS.md)
            - "yield_curve_slope"        # Нахил кривої дохідності (10Y - 2Y)
            - "yield_curve_inverted"     # Прапорець інверсії (0/1)
            - "fed_funds_trend"          # Тренд ставки Fed Funds (3 місяці)
            - "fed_funds_velocity"       # Швидкість зміни ставки (1 місяць)
            - "market_breadth"           # Ширина ринку (advance/decline)
            - "dollar_strength"          # Сила долара (DXY)
            - "put_call_ratio"           # Put/Call ratio (страх на ринку)
        data_mapping:
          - "price_data"
          - "market_indicators"
      - name: "market_phase_analyzer"
        module: "src.analytics.context.market_phase_analyzer"
        class: "MarketPhaseAnalyzer"
        data_mapping:
          - "price_data"
      - name: "prediction_adjuster"
        module: "src.analytics.context.prediction_adjuster"
        class: "PredictionAdjuster"
        data_mapping:
          - "predictions"
          - "market_context"
      - name: "hedge_fund_style"
        module: "src.analytics.analyzers.hedge_fund_analyzer"
        class: "HedgeFundAnalyzer"
        data_mapping:
          - "price_data"
          - "returns"
      - name: "adaptive_confidence"
        module: "src.analytics.analyzers.adaptive_confidence_analyzer"
        class: "AdaptiveConfidenceAnalyzer"
        data_mapping:
          - "predictions"
          - "performance_metrics"
      - name: "causal_events"
        module: "src.analytics.analyzers.causal_event_finder"
        class: "CausalEventFinder"
        params:
          treatment: "event_detected"
          outcome: "future_return"
          common_causes: ["volatility", "volume"]
        data_mapping:
          - "macro_data"
          - "price_data"
      - name: "knn_similarity"
        module: "src.analytics.analyzers.knn_similarity_finder"
        class: "KnnSimilarityFinder"
        data_mapping:
          - "price_data"
          - "feature_space"

  # Configuration for the CriticalSignalDetector
  critical_signal_detector:
    price_shock:
      window: 3
      threshold: -0.07 # 7% drop in 3 periods
    volume_spike:
      window: 10
      multiplier: 4.0 # 4x the average volume
    volatility_explosion:
      window: 15
      multiplier: 3.0 # 3x the average volatility
    # Sensitive settings for intraday timeframes (e.g., 5m)
    timeframe_5m:
      price_shock:
        window: 3
        threshold: -0.02 # 2% drop in 3 periods
      volume_spike:
        window: 10
        multiplier: 2.0
      volatility_explosion:
        window: 10
        multiplier: 1.8

  # Configuration for the NewsImpactAnalyzer
  news_impact:
    news_weights:
      general_news: 1.0
      earnings: 1.7
      m_and_a: 2.0
      product_launch: 1.3
      guidance: 1.8
    half_life_hours: 18
    significance_thresholds:
      high_impact: 1.8
      medium_impact: 0.9
    news_categories:
      earnings: ['earnings', 'revenue', 'profit', 'guidance', 'EPS']
      m_and_a: ['merger', 'acquisition', 'takeover', 'buyout', 'deal']
      product_launch: ['launch', 'release', 'new product', 'announcement']
      legal: ['lawsuit', 'regulation', 'antitrust', 'probe']

  # Configuration for the MacroContextAnalyzer
  macro_context:
    regime_thresholds:
      strong_expansion: 0.6
      expansion: 0.25
      strong_contraction: -0.6
      contraction: -0.25
    indicators:
      gdp_growth:
        weight: 0.25
        direction: "higher_is_better"
        threshold: 0.6
      unemployment_rate:
        weight: 0.20
        direction: "lower_is_better"
        threshold: 0.25
      cpi_inflation:
        weight: 0.20
        direction: "lower_is_better"
        threshold: 0.35
      vix_index:
        weight: 0.10
        direction: "lower_is_better"
        threshold: 2.5
      consumer_confidence:
        weight: 0.10
        direction: "higher_is_better"
        threshold: 6.0
      interest_rate:
        weight: 0.25
        direction: "lower_is_better"
        threshold: 0.3
      credit_spread:
        weight: 0.15
        direction: "lower_is_better"
        threshold: 0.25

  # Configuration for feature engineering analyzers
  feature_engineering:
    # Settings for the SignificanceAnalyzer
    significance_analyzer:
      significance_col: 'is_significant'
      min_events_per_ticker: 5
      mode: 'feature_engineering'

# ---------------------------------
# Strategy Section
# ---------------------------------
strategy:
  # Configuration for the TradingAdvisor
  trading_advisor:
    # Weights for aggregating signals
    weights:
      forecast: 0.5
      rsi: 0.15
      sentiment: 0.15
      macro_context: 0.2
    
    # Thresholds for generating final BUY/SELL signals
    thresholds:
      buy: 0.5
      sell: -0.5

    # Thresholds for interpreting RSI values
    rsi_thresholds:
      oversold: 25
      overbought: 75

    # Multipliers to adjust final score based on market context
    context_multipliers:
      bull_market: 1.15
      bear_market: 0.85
      sideways_market: 0.9

  # Configuration for different trading strategies
  strategies:
    aggressive_growth:
      description: "An aggressive strategy focused on high-growth tech stocks."
      model_type: "transformer_model"
      target_configs:
        - name: "rolling_vol_10d"
          calculator_class: "VolatilityCalculator"
          method_name: "calculate_rolling_volatility"
          params:
            window: 10
          input_type: "returns"
        - name: "max_drawdown_30d"
          calculator_class: "DrawdownCalculator"
          method_name: "calculate_rolling_max_drawdown"
          params:
            window: 30
            price_col: "close"
          input_type: "prices"
      feature_config:
        required_features:
          - "RSI_7"
          - "EMA_10"
          - "news_sentiment_trending"

# ---------------------------------
# Training Pipeline Definition
# ---------------------------------

training_pipeline:
  - name: "Stage_0_Setup"
    enabled: true
    class_path: "src.pipeline.stages.stage_0_setup.Stage_0_Setup"
  - name: "Stage_1_Collection"
    enabled: true
    class_path: "src.pipeline.stages.stage_1_collection.CollectionStage"
  - name: "Stage_2_Processing"
    enabled: true
    class_path: "src.pipeline.stages.stage_2_processing.ProcessingStage"
  - name: "Stage_3_Feature_Engineering"
    enabled: true
    class_path: "src.pipeline.stages.stage_3_feature_engineering.FeatureEngineeringStage"
  - name: "Stage_4_Modeling"
    enabled: true
    class_path: "src.pipeline.stages.stage_4_modeling.ModelingStage"
  - name: "Stage_5_Prediction"
    enabled: true
    class_path: "src.pipeline.stages.stage_5_prediction.PredictionStage"
  - name: "Stage_6_Trading_Execution"
    enabled: true
    class_path: "src.pipeline.stages.stage_6_trading_execution.TradingExecutionStage"
  - name: "Stage_7_Evaluation"
    enabled: true
    class_path: "src.pipeline.stages.stage_7_evaluation.EvaluationStage"
