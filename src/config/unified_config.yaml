        - "volume"
        - "news_sentiment"
        - "twitter_sentiment"
    
    # Settings for data preparation
    preparation:
      test_size: 0.2
      seq_len: 20 # For heavy models
    
    # Settings for normalization
    normalization:
      features:
        - {feature: 'close', scaler_type: 'standard'}
        - {feature: 'volume', scaler_type: 'min_max'}
    
    # Modular Enrichers Configuration

