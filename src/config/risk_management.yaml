# Risk Management Configuration
# Risk management system settings

strategy:
  risk_management:
    # VaR Settings
    var_confidence_levels: [0.95, 0.99]
    var_time_horizon_days: 1
    annual_trading_days: 252

    # Risk Limits
    max_portfolio_var_pct: 0.05      # 5% max portfolio VaR
    max_single_position_pct: 0.10    # 10% max single position
    max_position_size_pct: 0.10      # read by PortfolioManager/AdaptivePositionSizer AND, since 06.09, enforced by VirtualPortfolio.buy_stock
    max_total_risk_pct: 0.51         # DERIVED 07.09, was 0.30. See the exposure note below; it is a proxy for a 9.5% volatility target.
    max_daily_loss_pct: 0.03         # 3% max daily loss. Not derived: on a 10%-vol book this is 4.8 sigma and never fires; on the equal-weight book it fired 72 times in 27 years (R56).
    max_drawdown_pct: 0.30           # DERIVED 07.09, was 0.15. See the block below before changing it.
    # LEVERAGE AND INVESTEDNESS ARE ONE KNOB, so they are now one number.
    # It was 2.0 against a 0.30 total-risk cap -- permitting 6.7x what the
    # other permitted, hence unable to ever bind, hence decoration (R56).
    # Leverage, investedness and position size all move volatility and nothing
    # else; two numbers on one knob guarantee a contradiction.
    #
    # NOT deleted, and that is deliberate: `EliteRiskMetrics` reads
    # `max_leverage` with a default of 2.0, so removing the key would have made
    # the code fall back to the very number this change is removing -- creating
    # the undeclared-key defect of #288 while fixing #290. Kept, tied to the
    # cap, and pinned equal by
    # tests/contracts/test_the_portfolio_obeys_its_declared_limits.py.
    max_leverage: 0.51               # == max_total_risk_pct, by construction

    # ---------------------------------------------------------------------
    # WHERE 0.30 COMES FROM, AND WHY IT IS NOT A ROUND NUMBER (R56, R57)
    #
    # A limit exists to say "something has broken". One a WORKING book reaches
    # routinely cannot say that. Measured, not assumed:
    #
    #   the old 15% was breached on day 508 of 6,800 by the equal-weight book,
    #   which returns 17.18%/yr and is the only thing in this project that
    #   makes money. It sat below the limit 8.2% of all days. The limit would
    #   have liquidated it.
    #
    #   bootstrapped with this panel's real tails (excess kurtosis 9.5), a
    #   HEALTHY Sharpe-2.0 book at 10% vol has a median worst drawdown of
    #   -17.0%, a 95th percentile of -24.5% and a 99th of -28.6%. The old 15%
    #   fired on 76% of healthy histories.
    #
    # So the floor for a meaningful limit is 24% (one history in twenty) and
    # 29% (one in a hundred). 30% is the owner's choice inside that measured
    # range, not a number picked for being round.
    #
    # AND WHAT FOLLOWS FROM IT, which is the part that is NOT a choice:
    # return = Sharpe x volatility, and the budget caps volatility. At the
    # Sharpe measured on this universe (0.928) a 30% budget buys about 8.4% a
    # year; on the real market (SPY, 0.553) it buys 3.9%. Twenty percent a year
    # at this budget requires Sharpe 1.70, which is 1.8x what exists. The
    # target of this project is therefore a SHARPE, not a percentage: exposure
    # is capped here and cannot supply the difference.
    #
    # WHERE 0.51 COMES FROM (R58). The 30% budget permits about 9.5% annual
    # volatility at the Sharpe we have. The equal-weight book runs at 18.52%
    # fully invested, so 9.5 / 18.52 = 51%. The real control is a VOLATILITY
    # TARGET and this percentage is a proxy for it -- the mapping from
    # investedness to volatility is a property of the BOOK, so a
    # dollar-neutral cross-sectional book will need its own measurement rather
    # than this number. No `target_volatility` key is added here, because a key
    # nothing reads is the defect of #288 and adding one to be tidy would be
    # committing it deliberately.
    #
    # AND WHAT DOES NOT BIND, which is worth knowing so it stops being
    # reasoned about: growth-optimal sizing. For a book with Sharpe S, growth
    # peaks at volatility S and is NEGATIVE past 2S -- that is Kelly, and it is
    # the objective part of "as much as possible". Measured against it, this
    # budget permits 0.27x to 0.52x of even QUARTER Kelly at every Sharpe this
    # project can reach. Kelly is not the constraint here and never will be;
    # the drawdown budget is, by a wide margin.
    #
    # EXPECT THE MEDIAN. Capping the 95th percentile at 30% still leaves a
    # MEDIAN worst drawdown near 20% over 27 years. Twenty percent down is the
    # normal case, not the alarm.
    # ---------------------------------------------------------------------
    # These said "# read by VirtualPortfolio" until 2026-09-08. True, and
    # misleading in the way that costs the most: VirtualPortfolio read them
    # into attributes and used them nowhere. It has no loop that compares a
    # price to a level -- it executes buy_stock and sell_stock and is told when.
    #
    # So NOTHING IN THE PAPER PORTFOLIO STOPS OUT AT 10%. Whoever set these
    # numbers was entitled to believe otherwise, which is why they are still
    # here, saying so, instead of quietly deleted.
    #
    # Where exit levels DO come from, and note it is a different number:
    # `recommendation_engine` computes `var_95 * stop_loss_multiplier`, and
    # `portfolio_manager` checks the level stored on the position itself.
    #
    # Wiring these instead would be choosing WHICH mechanism governs exits --
    # a design decision, not plumbing, and one for the owner.
    #
    # NOT listed in tests/known_unread_risk_settings.txt, and the reason is a
    # limit of that mechanism worth knowing: it searches src/ by key NAME, so
    # the comment in virtual_portfolio.py that EXPLAINS these are dead is
    # itself enough to make them look read. Its own docstring already says a
    # search by name cannot tell a dead assignment from a use. The record
    # therefore lives here and in that comment, where a person will read it,
    # rather than in a registry the search would immediately call stale.
    stop_loss_pct: 0.10              # DECLARED, NOT APPLIED -- see above
    take_profit_pct: 0.20            # DECLARED, NOT APPLIED -- see above

    # Adaptive position sizing (src/algorithms/adaptive_position_sizer.py)
    position_sizer:
      max_position_size_pct: 0.10
      min_position_size_pct: 0.005

    # Risk-parity allocation (src/algorithms/risk_parity_allocator.py)
    risk_allocator: {}

    # Stress Testing Scenarios
    stress_scenarios:
      market_crash:
        shock: -0.15
        description: "15% market crash scenario"
      volatility_spike:
        volatility_multiplier: 3.0
        description: "3x volatility increase"
      liquidity_crisis:
        liquidity_dryup: 0.8
        description: "80% liquidity reduction"
      interest_rate_shock:
        rate_change: 0.025
        description: "2.5% interest rate increase"

    # Liquidity Risk Settings
    # NOT IMPLEMENTED, all three: no liquidity model reads them (#288). Market
    # impact IS measured -- R24 puts it at a third of the edge above ~$5M of
    # capital -- but in a diagnostic, not enforced here. The traded spread the
    # net test actually charges comes from targets.yaml, not from this line.
    liquidity_risk:
      min_volume_threshold: 1000000    # $1M minimum daily volume
      max_market_impact_pct: 0.10      # 10% max market impact
      spread_multiplier: 0.01          # Spread estimation multiplier

    # Risk Monitoring
    monitoring:
      alert_thresholds:
        # var_warning and drawdown_warning are NOT IMPLEMENTED (#288): an alert
        # that watches a VaR nothing computes can never fire. concentration_warning
        # does have a reader.
        var_warning: 0.03               # 3% VaR warning
        drawdown_warning: 0.10          # 10% drawdown warning
        concentration_warning: 0.15     # 15% concentration warning

      # Alert Channels
      alerts:
        email: true
        slack: false
        telegram: false
        log: true

# Integration with other modules.
#
# THESE SIX WERE `risk_integration:` AND `risk_controls:` UNTIL 2026-09-06, and
# every one of them is `true` while nothing implements it -- measured that day:
# neither name appears in any Python file in this repository. A `true` beside
# the words "pre trade var check" reads as a guarantee that the check happens.
# It does not happen.
#
# They are kept rather than deleted because they record an intention, and moved
# under `not_implemented` so that intention cannot be mistaken for a state.
# Moving them is provably safe: `tests/contracts/test_a_declared_risk_limit_has_a_reader.py`
# proves no code names them. See REGISTER #288 and #101.
analytics:
  not_implemented:
    enable_var_in_signals: true
    enable_stress_tests: true
    risk_adjusted_returns: true

trading:
  not_implemented:
    pre_trade_var_check: true
    position_size_limits: true
    portfolio_rebalancing: true